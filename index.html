<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akeed ERP</title>
<style>
:root{--navy:#14284b;--orange:#f08c1e;--bg:#f4f6fa;--line:#dfe3ea;--text:#1d2433;--muted:#6b7385;--ok:#1e8e3e;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:250px;background:var(--navy);color:#fff;flex-shrink:0;overflow-y:auto;max-height:100vh;position:sticky;top:0}
aside h1{font-size:18px;margin:0;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
aside h1 span{color:var(--orange)}
.grp{padding:12px 16px 4px;font-size:11px;color:#9fb0cf}
aside a{display:block;padding:7px 22px;color:#e6ebf5;text-decoration:none;cursor:pointer;font-size:13px}
aside a:hover{background:rgba(255,255,255,.07)}
aside a.active{background:var(--orange);color:#fff}
main{flex:1;padding:22px;min-width:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0;font-size:20px;margin-inline-end:auto}
.bar label{display:flex;align-items:center;gap:6px;font-size:13px}
.bar input[type=date]{width:auto}
button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit}
button:hover{border-color:#b9c0cf}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.acc{background:var(--orange);color:#fff;border-color:var(--orange)}
button.danger{color:var(--bad)}
button.sm{padding:3px 9px;font-size:12px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
input:disabled,select:disabled,textarea:disabled{background:#f3f4f7;color:#444}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:#eef1f7;font-weight:600;font-size:12px;color:#3b4560;position:sticky;top:0;z-index:1}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.badge{padding:2px 8px;border-radius:10px;font-size:11px}
.b-draft{background:#fff3e0;color:#b45f06}.b-posted{background:#e6f4ea;color:var(--ok)}.b-rev{background:#fde7e7;color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:min(1100px,100%);padding:18px}
.modal h3{margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.grid label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
.grid label.chk input{width:auto}
.req::after{content:" *";color:var(--bad)}
.err{background:#fde7e7;color:var(--bad);padding:8px 12px;border-radius:6px;margin:10px 0;white-space:pre-line}
.toast{position:fixed;bottom:18px;left:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:60}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;border-top:3px solid var(--orange)}
.kpi span{color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:6px}
.muted{color:var(--muted)}
.lines td{padding:4px}
.lines input,.lines select{padding:4px 6px}
.tot td{font-weight:700;background:#f7f8fb}
.ok{color:var(--ok)}.bad{color:var(--bad)}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{padding:5px 0}
@media(max-width:800px){.app{flex-direction:column}aside{width:100%;max-height:none;position:static}}
</style>
</head>
<body>
<div class="app">
  <aside><h1>Akeed <span>ERP</span></h1><nav id="nav"></nav></aside>
  <main id="main"></main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" style="display:none">

<script>
"use strict";
/* =================== Helpers =================== */
const LS_KEY = "akeed_erp_v1";
const $ = s => document.querySelector(s);
const mainEl = $("#main"), modalEl = $("#modal");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmt = n => r2(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => new Date().toISOString().slice(0, 10);
const iso = d => d.toISOString().slice(0, 10);
const sum = (arr, k) => (arr || []).reduce((s, x) => s + (Number(x[k]) || 0), 0);
const addDays = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return iso(x); };

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 2200); }
function showModal(html) { modalEl.innerHTML = html; modalEl.oninput = null; modalEl.onchange = null; modalEl.onclick = null; $("#mbg").style.display = "flex"; }
function closeModal() { $("#mbg").style.display = "none"; }
$("#mbg").addEventListener("click", e => { if (e.target.closest("[data-close]")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function download(name, text, type = "text/plain") {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function pickFile(accept, cb) {
  const f = $("#filePick"); f.value = ""; f.accept = accept;
  f.onchange = () => { const file = f.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => cb(String(rd.result)); rd.readAsText(file, "utf-8"); };
  f.click();
}

/* =================== Schema (Master data) =================== */
const ACC_TYPES = [["ASSET","أصول"],["LIABILITY","خصوم"],["EQUITY","حقوق ملكية"],["REVENUE","إيرادات"],["EXPENSE","مصروفات"]];
const OUT = t => t.kind === "OUTPUT", INP = t => t.kind === "INPUT";
const STATUS = {k:"status", l:"الحالة", t:"status", ro:1, def:"DRAFT"};

const S = {
  company: {title:"الشركة", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم (EN)",req:1},{k:"nameAr",l:"الاسم (AR)"},
    {k:"vat",l:"الرقم الضريبي",pattern:"^3\\d{13}3$",hint:"15 رقم يبدأ وينتهي بـ 3"},
    {k:"cr",l:"السجل التجاري",list:false},{k:"city",l:"المدينة"},{k:"address",l:"العنوان",list:false},
    {k:"baseCurrency",l:"عملة الأساس",t:"ref",ref:"currency",req:1}]},
  currency: {title:"العملات", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1,pattern:"^[A-Z]{3}$",hint:"3 حروف كبيرة"},{k:"name",l:"الاسم",req:1},
    {k:"decimals",l:"الكسور العشرية",t:"num",def:2,min:0}]},
  fxRate: {title:"أسعار الصرف", unique:[["currency","date"]], label:r => `${refCode("currency",r.currency)} ${r.date}`, fields:[
    {k:"currency",l:"العملة",t:"ref",ref:"currency",req:1},{k:"date",l:"التاريخ",t:"date",req:1,def:today},
    {k:"rate",l:"السعر مقابل عملة الأساس",t:"num",req:1,min:0.000001}]},
  numSeq: {title:"تسلسل الأرقام", unique:["code"], fields:[
    {k:"code",l:"المستند",t:"enum",req:1,opts:[["JV","قيد يومية"],["INV","فاتورة عميل"],["CN","إشعار دائن عميل"],["VI","فاتورة مورد"],["VCN","إشعار دائن مورد"],["RCPT","سند قبض"],["PAY","سند صرف"]]},
    {k:"prefix",l:"البادئة",req:1},{k:"next",l:"الرقم التالي",t:"num",def:1,req:1,min:1},{k:"pad",l:"عدد الخانات",t:"num",def:6,min:1}]},
  fiscalYear: {title:"السنوات المالية", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"start",l:"البداية",t:"date",req:1},{k:"end",l:"النهاية",t:"date",req:1}],
    validate: r => (r.end <= r.start ? "النهاية لازم تكون بعد البداية" : DB.fiscalYear.some(y => y.id !== r.id && y.start <= r.end && y.end >= r.start) ? "السنة متداخلة مع سنة أخرى" : null),
    afterSave: r => { if (!DB.period.some(p => p.year === r.id)) genPeriods(r); }},
  period: {title:"الفترات المالية", noAdd:1, noDelete:1, label:r => `${refCode("fiscalYear",r.year)}-P${String(r.no).padStart(2,"0")}`, fields:[
    {k:"year",l:"السنة",t:"ref",ref:"fiscalYear",ro:1},{k:"no",l:"رقم الفترة",t:"num",ro:1},
    {k:"start",l:"من",t:"date",ro:1},{k:"end",l:"إلى",t:"date",ro:1},
    {k:"status",l:"الحالة",t:"enum",req:1,opts:[["OPEN","مفتوحة"],["ON_HOLD","معلّقة"],["CLOSED","مقفولة"]]}]},

  account: {title:"الحسابات الرئيسية", unique:["code"], sort:"code", fields:[
    {k:"code",l:"رقم الحساب",req:1},{k:"name",l:"الاسم (EN)",req:1},{k:"nameAr",l:"الاسم (AR)"},
    {k:"type",l:"النوع",t:"enum",opts:ACC_TYPES,req:1},{k:"parent",l:"الحساب الأب",t:"ref",ref:"account",filter:a => !a.posting},
    {k:"posting",l:"يقبل ترحيل",t:"bool",def:true},{k:"blocked",l:"موقوف",t:"bool",def:false},
    {k:"reqDim",l:"بُعد إجباري",t:"ref",ref:"dimension",list:false}],
    validate: r => r.parent === r.id ? "الحساب لا يكون أبًا لنفسه" : null},
  dimension: {title:"الأبعاد المالية", unique:["code"], fields:[{k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1}]},
  dimValue: {title:"قيم الأبعاد", unique:[["dimension","code"]], label:r => `${refCode("dimension",r.dimension)}:${r.code} ${r.name}`, fields:[
    {k:"dimension",l:"البُعد",t:"ref",ref:"dimension",req:1},{k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},
    {k:"active",l:"نشط",t:"bool",def:true}]},

  taxCode: {title:"أكواد الضريبة", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},
    {k:"kind",l:"النوع",t:"enum",req:1,opts:[["OUTPUT","مخرجات (مبيعات)"],["INPUT","مدخلات (مشتريات)"]]},
    {k:"rate",l:"النسبة %",t:"num",req:1,min:0},
    {k:"zatca",l:"فئة ZATCA",t:"enum",req:1,opts:[["S","S - Standard"],["Z","Z - Zero rated"],["E","E - Exempt"],["O","O - Out of scope"]]},
    {k:"account",l:"حساب الضريبة",t:"ref",ref:"account",req:1}]},
  taxRegion: {title:"المناطق الضريبية", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الوصف",req:1},
    {k:"scope",l:"النطاق",t:"enum",req:1,opts:[["DOM","محلي"],["INTL","دولي"]]},
    {k:"outTax",l:"ضريبة المبيعات",t:"ref",ref:"taxCode",req:1,filter:OUT},
    {k:"inTax",l:"ضريبة المشتريات",t:"ref",ref:"taxCode",req:1,filter:INP},
    {k:"sfTax",l:"ضريبة رسوم الخدمة",t:"ref",ref:"taxCode",filter:OUT}]},
  airport: {title:"المطارات", unique:["code"], fields:[
    {k:"code",l:"كود IATA",req:1,pattern:"^[A-Z]{3}$"},{k:"name",l:"الاسم",req:1},{k:"city",l:"المدينة"},
    {k:"country",l:"الدولة (ISO)",req:1,pattern:"^[A-Z]{2}$"},{k:"region",l:"المنطقة الضريبية",t:"ref",ref:"taxRegion"}]},

  payTerm: {title:"شروط السداد", unique:["code"], fields:[{k:"code",l:"الكود",req:1},{k:"name",l:"الوصف"},{k:"days",l:"عدد الأيام",t:"num",def:0,min:0}]},
  payMethod: {title:"طرق الدفع", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},
    {k:"kind",l:"النوع",t:"enum",req:1,opts:[["CASH","نقدي"],["BANK","تحويل بنكي"],["CARD","بطاقة (مدى/فيزا)"],["GATEWAY","بوابة دفع"],["CTA","AMEX CTA / GR"],["WALLET","محفظة"],["CHEQUE","شيك"]]},
    {k:"account",l:"الحساب",t:"ref",ref:"account",req:1},{k:"feePct",l:"عمولة %",t:"num",def:0,min:0},{k:"feeFixed",l:"رسم ثابت",t:"num",def:0,min:0}]},
  bank: {title:"البنوك", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"اسم البنك",req:1},{k:"iban",l:"IBAN",pattern:"^SA\\d{22}$",hint:"SA + 22 رقم"},
    {k:"currency",l:"العملة",t:"ref",ref:"currency"},{k:"account",l:"الحساب",t:"ref",ref:"account",req:1}]},

  custGroup: {title:"مجموعات العملاء", unique:["code"], fields:[{k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},{k:"arAccount",l:"حساب الذمم المدينة",t:"ref",ref:"account",req:1}]},
  customer: {title:"العملاء", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},{k:"nameAr",l:"الاسم (AR)",list:false},
    {k:"category",l:"الفئة",t:"enum",req:1,def:"B2B",opts:[["B2C","B2C"],["B2B","B2B"],["B2G","B2G"]]},
    {k:"group",l:"المجموعة",t:"ref",ref:"custGroup",req:1},
    {k:"vat",l:"الرقم الضريبي",pattern:"^3\\d{13}3$",hint:"إجباري لعملاء B2B"},{k:"cr",l:"السجل التجاري",list:false},
    {k:"payTerm",l:"شرط السداد",t:"ref",ref:"payTerm"},{k:"creditLimit",l:"حد الائتمان",t:"num",def:0,min:0,money:1},
    {k:"phone",l:"الهاتف",list:false},{k:"email",l:"البريد",list:false},{k:"address",l:"العنوان",list:false},
    {k:"blocked",l:"موقوف",t:"bool",def:false}],
    validate: r => (r.category === "B2B" && !r.vat ? "عملاء B2B لازم يكون لهم رقم ضريبي" : null)},
  sfContract: {title:"عقود رسوم الخدمة", label:r => `${refCode("customer",r.customer)} / ${refCode("item",r.service)}`, fields:[
    {k:"customer",l:"العميل",t:"ref",ref:"customer",req:1},{k:"service",l:"الخدمة",t:"ref",ref:"item",req:1},
    {k:"basis",l:"الأساس",t:"enum",req:1,opts:[["PUBLISHED","% من السعر المنشور (Fare+Tax)"],["COST","% من التكلفة"],["FLAT","مبلغ ثابت"]]},
    {k:"value",l:"النسبة / المبلغ",t:"num",req:1,min:0},{k:"min",l:"حد أدنى",t:"num",def:0,min:0},
    {k:"vatIncl",l:"شامل الضريبة",t:"bool",def:false},{k:"from",l:"من",t:"date",req:1,def:today},{k:"to",l:"إلى",t:"date"}],
    validate: r => (r.to && r.to < r.from ? "تاريخ النهاية قبل البداية" : null)},
  salesAgent: {title:"موظفو المبيعات", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},{k:"branch",l:"الفرع",t:"ref",ref:"dimValue"},
    {k:"email",l:"البريد"},{k:"active",l:"نشط",t:"bool",def:true}]},

  vendGroup: {title:"مجموعات الموردين", unique:["code"], fields:[{k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},{k:"apAccount",l:"حساب الذمم الدائنة",t:"ref",ref:"account",req:1}]},
  vendor: {title:"الموردين", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},{k:"nameAr",l:"الاسم (AR)",list:false},
    {k:"group",l:"المجموعة",t:"ref",ref:"vendGroup",req:1},{k:"vat",l:"الرقم الضريبي",pattern:"^3\\d{13}3$"},
    {k:"payTerm",l:"شرط السداد",t:"ref",ref:"payTerm"},{k:"iban",l:"IBAN",list:false},
    {k:"phone",l:"الهاتف",list:false},{k:"email",l:"البريد",list:false},{k:"blocked",l:"موقوف",t:"bool",def:false}]},
  airline: {title:"شركات الطيران", unique:["code"], fields:[
    {k:"code",l:"كود IATA",req:1,pattern:"^[A-Z0-9]{2}$"},{k:"num",l:"الكود الرقمي",req:1,pattern:"^\\d{3}$",hint:"3 أرقام (065 للسعودية)"},
    {k:"name",l:"الاسم",req:1},{k:"vendor",l:"المورد",t:"ref",ref:"vendor",req:1},
    {k:"settle",l:"طريقة التسوية",t:"enum",req:1,opts:[["BSP","BSP"],["DIRECT","مباشر"]]},{k:"comm",l:"عمولة STD %",t:"num",def:0,min:0}]},

  item: {title:"الخدمات / الأصناف", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},
    {k:"type",l:"النوع",t:"enum",req:1,opts:[["FLIGHT","طيران"],["HOTEL","فنادق"],["VISA","تأشيرات"],["INSURANCE","تأمين"],["TRANSPORT","نقل"],["FEE","رسوم خدمة"],["OTHER","أخرى"]]},
    {k:"revAccount",l:"حساب الإيراد",t:"ref",ref:"account",req:1},{k:"costAccount",l:"حساب التكلفة",t:"ref",ref:"account"},
    {k:"outTax",l:"ضريبة البيع الافتراضية",t:"ref",ref:"taxCode",filter:OUT},{k:"inTax",l:"ضريبة الشراء الافتراضية",t:"ref",ref:"taxCode",filter:INP}]},

  receipt: {title:"سندات القبض", doc:1, post:p => postPayment(p, true), fields:[
    {k:"number",l:"الرقم",ro:1},{k:"date",l:"التاريخ",t:"date",req:1,def:today},
    {k:"customer",l:"العميل",t:"ref",ref:"customer",req:1,filter:c => !c.blocked},
    {k:"method",l:"طريقة الدفع",t:"ref",ref:"payMethod",req:1},{k:"amount",l:"المبلغ",t:"num",req:1,min:0.01,money:1},
    {k:"ref",l:"المرجع"},{k:"jv",l:"القيد",ro:1},STATUS]},
  vendPayment: {title:"سندات الصرف", doc:1, post:p => postPayment(p, false), fields:[
    {k:"number",l:"الرقم",ro:1},{k:"date",l:"التاريخ",t:"date",req:1,def:today},
    {k:"vendor",l:"المورد",t:"ref",ref:"vendor",req:1,filter:v => !v.blocked},
    {k:"method",l:"طريقة الدفع",t:"ref",ref:"payMethod",req:1},{k:"amount",l:"المبلغ",t:"num",req:1,min:0.01,money:1},
    {k:"ref",l:"المرجع"},{k:"jv",l:"القيد",ro:1},STATUS]},
};
const TX_KEYS = ["journal", "arInv", "apInv"];

/* =================== Navigation =================== */
const NAV = [
  ["الرئيسية", [["dash","لوحة التحكم"]]],
  ["الإعدادات العامة", [["company","الشركة"],["currency","العملات"],["fxRate","أسعار الصرف"],["numSeq","تسلسل الأرقام"],["fiscalYear","السنوات المالية"],["period","الفترات المالية"]]],
  ["دليل الحسابات", [["account","الحسابات الرئيسية"],["dimension","الأبعاد المالية"],["dimValue","قيم الأبعاد"]]],
  ["الضرائب", [["taxCode","أكواد الضريبة"],["taxRegion","المناطق الضريبية"],["airport","المطارات"]]],
  ["السداد والبنوك", [["payTerm","شروط السداد"],["payMethod","طرق الدفع"],["bank","البنوك"]]],
  ["العملاء", [["custGroup","مجموعات العملاء"],["customer","العملاء"],["sfContract","عقود رسوم الخدمة"],["salesAgent","موظفو المبيعات"]]],
  ["الموردين", [["vendGroup","مجموعات الموردين"],["vendor","الموردين"],["airline","شركات الطيران"]]],
  ["الخدمات", [["item","الخدمات / الأصناف"]]],
  ["المعاملات", [["journal","القيود اليومية"],["arInv","فواتير العملاء"],["apInv","فواتير الموردين"],["receipt","سندات القبض"],["vendPayment","سندات الصرف"]]],
  ["التقارير", [["tb","ميزان المراجعة"],["vat","تقرير ضريبة القيمة المضافة"],["balances","أرصدة العملاء والموردين"]]],
  ["أدوات", [["tools","نسخ احتياطي واستعادة"]]],
];
const JT = {GENERAL:"عام",AR:"مبيعات",AP:"مشتريات",RCPT:"قبض",PAY:"صرف",REVERSAL:"عكس"};
let current = "dash";
let RANGE = {from: new Date().getFullYear() + "-01-01", to: today()};

/* =================== Data store =================== */
let DB = null;
function emptyDB() { const d = {}; Object.keys(S).concat(TX_KEYS).forEach(k => d[k] = []); return d; }
function load() {
  try { const s = localStorage.getItem(LS_KEY); if (s) DB = JSON.parse(s); } catch (e) { DB = null; }
  if (!DB || typeof DB !== "object") DB = seed();
  Object.keys(S).concat(TX_KEYS).forEach(k => { if (!Array.isArray(DB[k])) DB[k] = []; });
}
function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) { toast("تعذر الحفظ في المتصفح"); } }
const rec = (ent, id) => (DB[ent] || []).find(x => x.id === id);
const refCode = (ent, id) => { const r = rec(ent, id); return r ? (r.code ?? "") : ""; };
function refLabel(ent, id) {
  const r = rec(ent, id); if (!r) return "";
  const sc = S[ent]; if (sc && sc.label) return sc.label(r);
  return [r.code, r.name].filter(Boolean).join(" — ");
}
function optList(ent, sel, filter, empty = true) {
  const rows = (DB[ent] || []).filter(r => !filter || filter(r) || r.id === sel);
  return (empty ? '<option value="">—</option>' : "") +
    rows.map(r => `<option value="${r.id}"${r.id === sel ? " selected" : ""}>${esc(refLabel(ent, r.id))}</option>`).join("");
}
function genPeriods(fy, db = DB) {
  let d = new Date(fy.start + "T00:00:00Z"); const end = new Date(fy.end + "T00:00:00Z"); let n = 1;
  while (d <= end) {
    const e = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0));
    const pe = e < end ? e : end;
    db.period.push({id: uid(), year: fy.id, no: n++, start: iso(d), end: iso(pe), status: "OPEN"});
    d = new Date(pe.getTime() + 86400000);
  }
}
function nextNo(code) {

  if (!s) { s = {id: uid(), code, prefix: code + "-", next: 1, pad: 6}; DB.numSeq.push(s); }
  const n = Number(s.next) || 1; s.next = n + 1;
  return s.prefix + String(n).padStart(Number(s.pad) || 6, "0");
}

/* =================== Generic master-data screens =================== */
function show(f, v) {

}
const statusBadge = v => `<span class="badge b-${v === "POSTED" ? "posted" : "draft"}">${v === "POSTED" ? "مرحّل" : "مسودة"}</span>`;

function renderList(key) {

function fieldHtml(f, v, ro) {
  const dis = (f.ro || ro) ? " disabled" : "", id = "f_" + f.k;
  const lab = `<span class="${f.req && !f.ro ? "req" : ""}">${f.l}</span>`;
  if (f.t === "bool") return `<label class="chk"><input type="checkbox" id="${id}"${v ? " checked" : ""}${dis}> ${lab}</label>`;
  let inp;
  if (f.t === "enum") inp = `<select id="${id}"${dis}><option value="">—</option>${f.opts.map(([a, b]) => `<option value="${a}"${a === v ? " selected" : ""}>${esc(b)}</option>`).join("")}</select>`;
  else if (f.t === "ref") inp = `<select id="${id}"${dis}>${optList(f.ref, v, f.filter)}</select>`;
  else if (f.t === "status") inp = `<input id="${id}" value="${v === "POSTED" ? "مرحّل" : "مسودة"}" disabled>`;
  else inp = `<input id="${id}" type="${f.t === "num" ? "number" : f.t === "date" ? "date" : "text"}"${f.t === "num" ? ' step="any"' : ""} value="${esc(v ?? "")}"${dis}>`;
  return `<label>${lab}${inp}${f.hint ? `<small class="muted">${esc(f.hint)}</small>` : ""}</label>`;
}
function readField(f) {
  const el = $("#f_" + f.k); if (!el) return undefined;

}
function defaults(sc) {

  return r;
}
function validateRec(key, r) {
  const sc = S[key], errs = [];
  for (const f of sc.fields) {
    if (f.ro || f.t === "status") continue;
    const v = r[f.k];
    if (f.req && (v === "" || v === null || v === undefined)) { errs.push(`${f.l}: مطلوب`); continue; }
    if (f.pattern && v && !new RegExp(f.pattern).test(v)) errs.push(`${f.l}: صيغة غير صحيحة${f.hint ? " (" + f.hint + ")" : ""}`);
    if (f.t === "num" && v !== null && v !== undefined && v !== "") {
      if (isNaN(v)) errs.push(`${f.l}: لازم رقم`);
      else if (f.min !== undefined && v < f.min) errs.push(`${f.l}: أقل قيمة ${f.min}`);
    }
    if (f.t === "ref" && v && !rec(f.ref, v)) errs.push(`${f.l}: مرجع غير موجود`);
  }
  for (const u of sc.unique || []) {
    const ks = Array.isArray(u) ? u : [u];
    if (ks.every(k => r[k] !== "" && r[k] != null) &&
        DB[key].some(x => x.id !== r.id && ks.every(k => String(x[k]).toLowerCase() === String(r[k]).toLowerCase())))
      errs.push(`مكرر: ${ks.map(k => sc.fields.find(f => f.k === k).l).join(" + ")}`);
  }

  return errs;
}
function openForm(key, id) {
  const sc = S[key], old = id ? rec(key, id) : null;
  const r = old ? {...old} : {id: uid(), ...defaults(sc)};
  const ro = !!(old && old.status === "POSTED");
  showModal(`<h3>${old ? (ro ? "عرض" : "تعديل") : "إضافة"} — ${sc.title}</h3>
    <div class="grid">${sc.fields.map(f => fieldHtml(f, r[f.k], ro)).join("")}</div>
    <div id="ferr"></div>
    <div class="bar" style="margin-top:14px"><span style="margin-inline-end:auto"></span>
    <button data-close>إغلاق</button>${ro ? "" : '<button class="pri" id="fsave">حفظ</button>'}</div>`);
  if (ro) return;

    const target = old ? Object.assign(old, r) : (DB[key].push(r), r);

}
function delRec(key, id) {
  const r = rec(key, id);
  if (r.status === "POSTED") return alert("لا يمكن حذف مستند مرحّل");
  const rest = JSON.stringify(Object.fromEntries(Object.entries(DB).map(([k, v]) => [k, k === key ? v.filter(x => x.id !== id) : v])));
  if (rest.includes(`"${id}"`)) return alert("لا يمكن الحذف: السجل مستخدم في بيانات أخرى");
  if (!confirm("تأكيد الحذف؟")) return;
  DB[key] = DB[key].filter(x => x.id !== id); persist(); route(key);
}

/* =================== CSV import / export =================== */
function toCSV(rows) { return "\ufeff" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n"); }
function exportCSV(key) {
  const sc = S[key], fs = sc.fields;
  const rows = [fs.map(f => f.l), ...DB[key].map(r => fs.map(f => f.t === "ref" ? (refCode(f.ref, r[f.k]) || refLabel(f.ref, r[f.k])) : f.t === "bool" ? (r[f.k] ? "1" : "0") : (r[f.k] ?? "")))];
  download(`${key}-${today()}.csv`, toCSV(rows), "text/csv");
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^\ufeff/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function importCSV(key, text) {
  const sc = S[key], rows = parseCSV(text);
  if (rows.length < 2) return alert("الملف فاضي أو بدون بيانات");
  const fmap = rows[0].map(h => sc.fields.find(f => f.k === h.trim() || f.l === h.trim()));
  const codeIdx = fmap.findIndex(f => f && f.k === "code");
  const byCode = (sc.unique || []).includes("code");
  let ok = 0; const errs = [];
  rows.slice(1).forEach((cells, ri) => {
    const code = codeIdx >= 0 ? (cells[codeIdx] || "").trim().toLowerCase() : "";
    const existing = byCode && code ? DB[key].find(x => String(x.code).toLowerCase() === code) : null;
    const r = existing ? {...existing} : {id: uid(), ...defaults(sc)};
    const e = [];
    fmap.forEach((f, ci) => {
      if (!f || f.ro || f.t === "status") return;
      const raw = (cells[ci] ?? "").trim();
      if (f.t === "ref") {
        if (!raw) { r[f.k] = ""; return; }
        const t = DB[f.ref].find(x => (x.code && String(x.code).toLowerCase() === raw.toLowerCase()) || refLabel(f.ref, x.id) === raw);
        if (!t) e.push(`${f.l}: "${raw}" غير موجود`); else r[f.k] = t.id;
      } else if (f.t === "enum") {
        const o = f.opts.find(o => o[0] === raw || o[1] === raw);
        if (raw && !o) e.push(`${f.l}: قيمة غير معروفة "${raw}"`);
        r[f.k] = o ? o[0] : "";
      } else if (f.t === "bool") r[f.k] = /^(1|true|yes|y|نعم|✓)$/i.test(raw);
      else if (f.t === "num") r[f.k] = raw === "" ? null : Number(raw);
      else r[f.k] = raw;
    });
    if (!e.length) e.push(...validateRec(key, r));
    if (e.length) { errs.push(`سطر ${ri + 2}: ${e.join("، ")}`); return; }
    const target = existing ? Object.assign(existing, r) : (DB[key].push(r), r);
    if (sc.afterSave) sc.afterSave(target, !existing);
    ok++;
  });
  persist(); route(key);
  alert(`تم استيراد/تحديث ${ok} سجل` + (errs.length ? `\n\nأخطاء (${errs.length}):\n` + errs.slice(0, 30).join("\n") : ""));
}

/* =================== GL posting engine =================== */
function L(acc, amt, extra = {}) {
  amt = r2(amt); if (!amt) return null;
  return {acc, dr: amt > 0 ? amt : 0, cr: amt < 0 ? -amt : 0, dim: "", cust: "", vend: "", tax: null, base: null, memo: "", ...extra};
}
const findPeriod = date => DB.period.find(p => p.start <= date && p.end >= date);
function validateJournal(j) {
  const e = [];
  const lines = (j.lines || []).filter(l => l && (l.acc || Number(l.dr) || Number(l.cr)));
  if (!j.date) e.push("التاريخ مطلوب");
  else {
    const p = findPeriod(j.date);
    if (!p) e.push(`لا توجد فترة مالية للتاريخ ${j.date}`);
    else if (p.status !== "OPEN") e.push(`الفترة التي تشمل ${j.date} غير مفتوحة`);
  }
  if (lines.length < 2) e.push("القيد يحتاج سطرين على الأقل");
  let dr = 0, cr = 0;
  lines.forEach((l, i) => {
    const n = i + 1, a = rec("account", l.acc);
    if (!a) { e.push(`سطر ${n}: اختر الحساب`); return; }
    if (!a.posting) e.push(`سطر ${n}: الحساب ${a.code} تجميعي ولا يقبل ترحيل`);
    if (a.blocked) e.push(`سطر ${n}: الحساب ${a.code} موقوف`);
    const d = r2(l.dr), c = r2(l.cr);
    if (d < 0 || c < 0 || (d > 0) === (c > 0)) e.push(`سطر ${n}: لازم مدين أو دائن موجب (واحد فقط)`);
    if (a.reqDim) { const dv = rec("dimValue", l.dim); if (!dv || dv.dimension !== a.reqDim) e.push(`سطر ${n}: الحساب ${a.code} يتطلب بُعد ${refLabel("dimension", a.reqDim)}`); }
    dr += d; cr += c;
  });
  if (r2(dr) !== r2(cr)) e.push(`القيد غير متوازن: مدين ${fmt(dr)} / دائن ${fmt(cr)}`);
  return {errs: e, lines};
}
function postJournal(j) {
  const {errs, lines} = validateJournal(j);
  if (errs.length) throw new Error(errs.join("\n"));
  j.lines = lines.map(l => ({...l, dr: r2(l.dr), cr: r2(l.cr)}));
  j.number = j.number || nextNo("JV");
  j.status = "POSTED"; j.postedAt = new Date().toISOString();
  if (!DB.journal.includes(j)) DB.journal.push(j);
  return j;
}
function reverseJournal(j, date) {
  if (j.status !== "POSTED") throw new Error("القيد غير مرحّل");
  if (j.reversedBy) throw new Error("القيد معكوس بالفعل");
  const rv = {id: uid(), date, type: "REVERSAL", desc: `عكس القيد ${j.number}`, status: "DRAFT", source: j.number,
    lines: j.lines.map(l => ({...l, dr: l.cr, cr: l.dr, base: l.base != null ? -l.base : null}))};
  postJournal(rv); j.reversedBy = rv.number; return rv;
}
function controlAccount(ar, party) {
  const g = rec(ar ? "custGroup" : "vendGroup", party.group);
  const acc = g && (ar ? g.arAccount : g.apAccount);
  if (!acc) throw new Error("مجموعة الطرف بدون حساب رقابة");
  return acc;
}
function postedLines(from, to) {
  const out = [];
  DB.journal.forEach(j => {
    if (j.status !== "POSTED" || (from && j.date < from) || (to && j.date > to)) return;
    j.lines.forEach(l => out.push({j, l}));
  });
  return out;
}
function partyBalance(field, id) { return r2(postedLines().filter(({l}) => l[field] === id).reduce((s, {l}) => s + l.dr - l.cr, 0)); }

/* Payments */
function postPayment(p, ar) {
  const party = rec(ar ? "customer" : "vendor", ar ? p.customer : p.vendor), m = rec("payMethod", p.method);
  if (!party || !m) throw new Error("بيانات السند ناقصة");
  if (party.blocked) throw new Error(`${party.code} موقوف`);
  if (!(Number(p.amount) > 0)) throw new Error("المبلغ لازم يكون موجب");
  const ctrl = controlAccount(ar, party), amt = r2(p.amount);
  const lines = ar ? [L(m.account, amt), L(ctrl, -amt, {cust: party.id})]
                   : [L(ctrl, amt, {vend: party.id}), L(m.account, -amt)];
  const j = {id: uid(), date: p.date, type: ar ? "RCPT" : "PAY", desc: `${ar ? "قبض من" : "صرف إلى"} ${party.name}${p.ref ? " — " + p.ref : ""}`, status: "DRAFT", lines};
  const v = validateJournal(j); if (v.errs.length) throw new Error(v.errs.join("\n"));
  postJournal(j);
  p.jv = j.number; p.number = nextNo(ar ? "RCPT" : "PAY"); p.status = "POSTED";
}

/* Invoices */
function invTotals(inv) {
  let net = 0, tax = 0;
  inv.lines.forEach(l => { const n = r2((+l.qty || 0) * (+l.price || 0)), t = rec("taxCode", l.tax); net += n; tax += t ? r2(n * t.rate / 100) : 0; });
  return {net: r2(net), tax: r2(tax), total: r2(net + tax)};
}
function postInvoice(kind, inv) {
  const ar = kind === "AR", key = ar ? "arInv" : "apInv";
  const party = rec(ar ? "customer" : "vendor", inv.party), e = [];
  if (!party) e.push(ar ? "اختر العميل" : "اختر المورد"); else if (party.blocked) e.push(`${party.code} موقوف`);
  if (!inv.date) e.push("التاريخ مطلوب");
  const lines = inv.lines.filter(l => l.item || l.acc || Number(l.price));
  if (!lines.length) e.push("المستند بدون سطور");
  const tk = ar ? "OUTPUT" : "INPUT";
  lines.forEach((l, i) => {
    if (!rec("account", l.acc)) e.push(`سطر ${i + 1}: اختر الحساب`);
    if (r2((+l.qty || 0) * (+l.price || 0)) <= 0) e.push(`سطر ${i + 1}: المبلغ لازم يكون موجب (المرتجع يتعمل إشعار دائن)`);
    const t = rec("taxCode", l.tax); if (t && t.kind !== tk) e.push(`سطر ${i + 1}: كود الضريبة ${t.code} غير مناسب`);
  });
  if (inv.cn && inv.original) {
    const o = DB[key].find(x => x.id === inv.original);
    if (!o || o.status !== "POSTED" || o.cn || o.party !== inv.party) e.push("الفاتورة الأصلية غير صالحة لهذا الإشعار");
  }
  if (e.length) throw new Error(e.join("\n"));
  const ctrl = controlAccount(ar, party);
  const sign = inv.cn ? -1 : 1, flow = ar ? sign : -sign;
  const jl = []; let total = 0;
  lines.forEach(l => {
    const n = r2(l.qty * l.price), t = rec("taxCode", l.tax), tx = t ? r2(n * t.rate / 100) : 0;
    jl.push(L(l.acc, -n * flow, {tax: t ? t.id : null, base: t ? r2(n * sign) : null, memo: l.desc || ""}));
    if (t && tx) jl.push(L(t.account, -tx * flow, {tax: t.id, base: null, memo: "VAT " + t.code}));
    total += n + tx;
  });
  total = r2(total);
  if (ar && !inv.cn && Number(party.creditLimit) > 0 && partyBalance("cust", party.id) + total > Number(party.creditLimit))
    throw new Error(`تجاوز حد الائتمان للعميل ${party.code} (الرصيد ${fmt(partyBalance("cust", party.id))} + ${fmt(total)} > ${fmt(party.creditLimit)})`);
  jl.push(L(ctrl, total * flow, ar ? {cust: party.id} : {vend: party.id}));
  const j = {id: uid(), date: inv.date, type: ar ? "AR" : "AP", desc: `${inv.cn ? "إشعار دائن" : "فاتورة"} ${party.name}`, status: "DRAFT", lines: jl.filter(Boolean)};
  const v = validateJournal(j); if (v.errs.length) throw new Error(v.errs.join("\n"));
  postJournal(j);
  const term = rec("payTerm", party.payTerm);
  inv.lines = lines;
  inv.due = inv.due || addDays(inv.date, term ? Number(term.days) || 0 : 0);
  inv.number = nextNo(ar ? (inv.cn ? "CN" : "INV") : (inv.cn ? "VCN" : "VI"));
  inv.jv = j.number; inv.status = "POSTED";
}

    <tfoot><tr class="tot"><td colspan="2">الإجمالي</td><td class="num">${fmt(rows.reduce((s, r) => s + r.b, 0))}</td>${ent === "customer" ? "<td></td>" : ""}</tr></tfoot></table></div></div>`;
  mainEl.innerHTML = `<div class="bar"><h2>أرصدة العملاء والموردين</h2></div>${tbl(c, "العملاء (مدين)", "customer")}${tbl(v, "الموردين (دائن)", "vendor")}`;
}

/* =================== Dashboard & tools =================== */
function renderDash() {
  const y = new Date().getFullYear(), m0 = today().slice(0, 8) + "01";
  const rev = postedLines(m0, today()).filter(({l}) => rec("account", l.acc)?.type === "REVENUE").reduce((s, {l}) => s + l.cr - l.dr, 0);
  const arBal = postedLines().filter(({l}) => l.cust).reduce((s, {l}) => s + l.dr - l.cr, 0);
  const apBal = postedLines().filter(({l}) => l.vend).reduce((s, {l}) => s + l.cr - l.dr, 0);
  const vat = vatReport(m0, today()).reduce((s, r) => s + (r.t.kind === "OUTPUT" ? r.tax : -r.tax), 0);
  const drafts = DB.journal.filter(x => x.status === "DRAFT").length + DB.arInv.filter(x => x.status === "DRAFT").length + DB.apInv.filter(x => x.status === "DRAFT").length + DB.receipt.filter(x => x.status === "DRAFT").length + DB.vendPayment.filter(x => x.status === "DRAFT").length;
  const p = findPeriod(today());
  const checks = [
    [DB.company.length > 0, "بيانات الشركة"],
    [!!(DB.company[0] && DB.company[0].vat), "الرقم الضريبي للشركة"],
    [!!(p && p.status === "OPEN"), "فترة مالية مفتوحة لتاريخ اليوم"],
    [["JV","INV","CN","VI","VCN","RCPT","PAY"].every(c => DB.numSeq.some(s => s.code === c)), "تسلسل أرقام لكل المستندات"],
    [DB.taxCode.some(t => t.kind === "OUTPUT") && DB.taxCode.some(t => t.kind === "INPUT"), "أكواد ضريبة مبيعات ومشتريات"],
    [DB.custGroup.length > 0 && DB.custGroup.every(g => rec("account", g.arAccount)), "مجموعات العملاء مربوطة بحسابات"],
    [DB.vendGroup.length > 0 && DB.vendGroup.every(g => rec("account", g.apAccount)), "مجموعات الموردين مربوطة بحسابات"],
    [DB.payMethod.length > 0, "طرق الدفع"],
    [DB.item.length > 0, "الخدمات / الأصناف"],
  ];
  mainEl.innerHTML = `<div class="bar"><h2>لوحة التحكم</h2><span class="muted">${esc(DB.company[0]?.nameAr || DB.company[0]?.name || "")}</span></div>
  <div class="kpis">
    <div class="kpi"><span>إيراد الشهر</span><b>${fmt(rev)}</b></div>
    <div class="kpi"><span>ذمم العملاء</span><b>${fmt(arBal)}</b></div>
    <div class="kpi"><span>ذمم الموردين</span><b>${fmt(apBal)}</b></div>
    <div class="kpi"><span>ضريبة الشهر (صافي)</span><b>${fmt(vat)}</b></div>
    <div class="kpi"><span>مستندات مسودة</span><b>${drafts}</b></div>
    <div class="kpi"><span>العملاء / الموردين / الحسابات</span><b>${DB.customer.length} / ${DB.vendor.length} / ${DB.account.length}</b></div>
  </div>
  <div class="card"><h3 style="margin-top:0">جاهزية الإعدادات</h3><ul class="check">${checks.map(([ok, t]) => `<li class="${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"} ${t}</li>`).join("")}</ul></div>
  <p class="muted">البيانات محفوظة في هذا المتصفح فقط. خد نسخة احتياطية من «أدوات» بشكل دوري.</p>`;
}
function renderTools() {
  mainEl.innerHTML = `<div class="bar"><h2>نسخ احتياطي واستعادة</h2></div>
  <div class="card"><p>تصدير كل البيانات لملف JSON، واستعادتها على نفس الجهاز أو على جهاز تاني.</p>
  <div class="bar"><button class="pri" id="bk">تنزيل نسخة احتياطية</button><button id="rs">استعادة من ملف</button></div></div>
  <div class="card"><p class="bad">إعادة الضبط بتمسح كل البيانات وترجّع البيانات الافتراضية.</p><button class="danger" id="reset">إعادة ضبط</button></div>`;
  $("#bk").onclick = () => download(`akeed-erp-backup-${today()}.json`, JSON.stringify(DB, null, 1), "application/json");
  $("#rs").onclick = () => pickFile(".json,application/json", t => {
    try {
      const d = JSON.parse(t);
      if (!d || !Array.isArray(d.account) || !Array.isArray(d.journal)) throw new Error("ملف غير صالح");
      if (!confirm("استبدال كل البيانات الحالية بمحتوى الملف؟")) return;
      DB = d; Object.keys(S).concat(TX_KEYS).forEach(k => { if (!Array.isArray(DB[k])) DB[k] = []; });
      persist(); toast("تمت الاستعادة"); route("dash");
    } catch (e) { alert("تعذرت الاستعادة: " + e.message); }
  });
  $("#reset").onclick = () => { if (confirm("مسح كل البيانات؟") && confirm("متأكد؟ العملية لا يمكن التراجع عنها")) { DB = seed(); persist(); route("dash"); } };
}

/* =================== Seed =================== */
function seed() {
  const d = emptyDB();
  const add = (k, o) => { o.id = uid(); d[k].push(o); return o.id; };
  const sar = add("currency", {code: "SAR", name: "ريال سعودي", decimals: 2});
  const usd = add("currency", {code: "USD", name: "دولار أمريكي", decimals: 2});
  const y = new Date().getFullYear();
  add("fxRate", {currency: usd, date: `${y}-01-01`, rate: 3.75});
  add("company", {code: "AKEED", name: "Fly Akeed Travel Agency", nameAr: "أكيد للسفر والسياحة", vat: "", cr: "", city: "الرياض", address: "", baseCurrency: sar});
  [["JV","JV-"],["INV","INV-"],["CN","CN-"],["VI","VI-"],["VCN","VCN-"],["RCPT","RCPT-"],["PAY","PAY-"]].forEach(([c, p]) => add("numSeq", {code: c, prefix: p, next: 1, pad: 6}));
  const fy = {id: uid(), code: String(y), start: `${y}-01-01`, end: `${y}-12-31`}; d.fiscalYear.push(fy); genPeriods(fy, d);

  const COA = [

    ["1102","Bank - main","البنك الرئيسي","ASSET","1",true],["1103","Gateway clearing","تسوية بوابات الدفع","ASSET","1",true],
    ["1104","AMEX CTA / GR clearing","تسوية AMEX CTA","ASSET","1",true],["1201","Trade receivables","ذمم العملاء","ASSET","1",true],
    ["1202","Refund tickets control","رقابة التذاكر المستردة","ASSET","1",true],["1301","Input VAT","ضريبة المدخلات","ASSET","1",true],
    ["2","Liabilities","الخصوم","LIABILITY",null,false],["2101","Trade payables - airlines/BSP","ذمم الموردين - الطيران/BSP","LIABILITY","2",true],
    ["2102","Customer wallet balances","أرصدة محافظ العملاء","LIABILITY","2",true],["2201","Output VAT","ضريبة المخرجات","LIABILITY","2",true],
    ["3","Equity","حقوق الملكية","EQUITY",null,false],["3101","Share capital","رأس المال","EQUITY","3",true],["3201","Retained earnings","الأرباح المحتجزة","EQUITY","3",true],
    ["4","Revenue","الإيرادات","REVENUE",null,false],["4101","Ticket sales","مبيعات التذاكر","REVENUE","4",true],
    ["4102","Service fee income","إيراد رسوم الخدمة","REVENUE","4",true],["4103","STD commission income","إيراد عمولة STD","REVENUE","4",true],
    ["4104","Extra earning / agency charge","إيرادات إضافية","REVENUE","4",true],["4105","Penalty income","إيراد غرامات","REVENUE","4",true],
    ["4106","Hotel revenue","إيراد الفنادق","REVENUE","4",true],
    ["5","Cost of sales","تكلفة المبيعات","EXPENSE",null,false],["5101","Cost of tickets","تكلفة التذاكر","EXPENSE","5",true],
    ["5102","Penalty cost","تكلفة الغرامات","EXPENSE","5",true],["5103","Hotel cost","تكلفة الفنادق","EXPENSE","5",true],
    ["6","Operating expenses","المصروفات التشغيلية","EXPENSE",null,false],["6101","Payment gateway fees","عمولات بوابات الدفع","EXPENSE","6",true],
    ["6102","Salaries","الرواتب","EXPENSE","6",true],["6103","Rent","الإيجار","EXPENSE","6",true],
  ];
  const A = {};
  COA.forEach(([c, n, na, t, p, post]) => { A[c] = add("account", {code: c, name: n, nameAr: na, type: t, parent: p ? A[p] : "", posting: post, blocked: false, reqDim: ""}); });

  const dims = {};
  [["DEPT","الإدارة",[["OPS","العمليات"],["FIN","المالية"],["SALES","المبيعات"]]],
   ["BRANCH","الفرع",[["RUH","الرياض"],["JED","جدة"],["DMM","الدمام"]]],
   ["SERVICE","نوع الخدمة",[["FLT","طيران"],["HTL","فنادق"],["OTH","خدمات أخرى"]]]].forEach(([c, n, vals]) => {

    vals.forEach(([vc, vn]) => add("dimValue", {dimension: dims[c], code: vc, name: vn, active: true}));

  const T = {};
  [["S15-OUT","ضريبة مبيعات 15% (محلي)","OUTPUT",15,"S","2201"],["Z0-OUT","ضريبة مبيعات 0% (دولي)","OUTPUT",0,"Z","2201"],
   ["S15-IN","ضريبة مشتريات 15%","INPUT",15,"S","1301"],["Z0-IN","ضريبة مشتريات 0%","INPUT",0,"Z","1301"]]
    .forEach(([c, n, k, r, z, a]) => { T[c] = add("taxCode", {code: c, name: n, kind: k, rate: r, zatca: z, account: A[a]}); });
  const dom = add("taxRegion", {code: "DOM", name: "داخل المملكة", scope: "DOM", outTax: T["S15-OUT"], inTax: T["S15-IN"], sfTax: T["S15-OUT"]});
  const intl = add("taxRegion", {code: "INTL", name: "دولي", scope: "INTL", outTax: T["Z0-OUT"], inTax: T["Z0-IN"], sfTax: T["Z0-OUT"]});
  [["RUH","الملك خالد الدولي","الرياض","SA"],["JED","الملك عبدالعزيز الدولي","جدة","SA"],["DMM","الملك فهد الدولي","الدمام","SA"],
   ["MED","الأمير محمد بن عبدالعزيز","المدينة المنورة","SA"],["AHB","أبها","أبها","SA"],["TUU","تبوك","تبوك","SA"],["ELQ","القصيم","القصيم","SA"],
   ["DXB","Dubai International","Dubai","AE"],["DOH","Hamad International","Doha","QA"],["BAH","Bahrain International","Manama","BH"],
   ["CAI","Cairo International","Cairo","EG"],["IST","Istanbul Airport","Istanbul","TR"],["LHR","London Heathrow","London","GB"]]
    .forEach(([c, n, city, cc]) => add("airport", {code: c, name: n, city, country: cc, region: cc === "SA" ? dom : intl}));

  const net0 = add("payTerm", {code: "NET0", name: "فوري", days: 0});

  [["CASH","نقدي","CASH","1101",0,0],["BANK","تحويل بنكي","BANK","1102",0,0],["MADA","مدى","CARD","1103",0.8,0],
   ["VISA","فيزا / ماستركارد","CARD","1103",1.85,0],["MOYASAR","Moyasar","GATEWAY","1103",0,0],["PAYFORT","Payfort","GATEWAY","1103",0,0],
   ["CTA","AMEX CTA / GR","CTA","1104",0,0],["WALLET","محفظة العميل","WALLET","2102",0,0]]
    .forEach(([c, n, k, a, p, f]) => add("payMethod", {code: c, name: n, kind: k, account: A[a], feePct: p, feeFixed: f}));
  add("bank", {code: "BNK01", name: "البنك الرئيسي", iban: "", currency: sar, account: A["1102"]});

  const gB2C = add("custGroup", {code: "B2C", name: "أفراد", arAccount: A["1201"]});
  const gCorp = add("custGroup", {code: "CORP", name: "شركات وجهات حكومية", arAccount: A["1201"]});
  add("customer", {code: "CASH", name: "Cash customer", nameAr: "عميل نقدي", category: "B2C", group: gB2C, vat: "", payTerm: net0, creditLimit: 0, blocked: false});
  const demo = add("customer", {code: "DEMO-B2B", name: "Demo Company", nameAr: "شركة تجريبية", category: "B2B", group: gCorp, vat: "300000000000003", payTerm: net30, creditLimit: 50000, blocked: false});

  const vAir = add("vendGroup", {code: "AIRLINES", name: "شركات الطيران / BSP", apAccount: A["2101"]});
  const vOth = add("vendGroup", {code: "OTHERS", name: "موردين آخرين", apAccount: A["2101"]});
  const bsp = add("vendor", {code: "BSP-SA", name: "BSP Saudi Arabia", group: vAir, payTerm: net0, blocked: false});
  add("vendor", {code: "HTL-01", name: "مورد فنادق", group: vOth, payTerm: net30, blocked: false});
  [["SV","065","Saudia"],["QR","157","Qatar Airways"],["EK","176","Emirates"],["TK","235","Turkish Airlines"],["GF","072","Gulf Air"],["MS","077","EgyptAir"]]
    .forEach(([c, n, name]) => add("airline", {code: c, num: n, name, vendor: bsp, settle: "BSP", comm: 0}));

  const items = {};
  [["TKT-DOM","تذكرة طيران داخلية","FLIGHT","4101","5101","S15-OUT","S15-IN"],["TKT-INTL","تذكرة طيران دولية","FLIGHT","4101","5101","Z0-OUT","Z0-IN"],
   ["SF-DOM","رسوم خدمة - محلي","FEE","4102","","S15-OUT",""],["SF-INTL","رسوم خدمة - دولي","FEE","4102","","Z0-OUT",""],
   ["HTL","حجز فندقي","HOTEL","4106","5103","S15-OUT","S15-IN"],["VISA","خدمة تأشيرة","VISA","4104","","S15-OUT",""]]
    .forEach(([c, n, t, ra, ca, ot, it]) => { items[c] = add("item", {code: c, name: n, type: t, revAccount: A[ra], costAccount: ca ? A[ca] : "", outTax: ot ? T[ot] : "", inTax: it ? T[it] : ""}); });
  add("sfContract", {customer: demo, service: items["SF-DOM"], basis: "PUBLISHED", value: 3, min: 0, vatIncl: false, from: `${y}-01-01`, to: ""});
  return d;
}

/* =================== Router & boot =================== */
function buildNav() {
  $("#nav").innerHTML = NAV.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([k, l]) => `<a data-k="${k}">${l}</a>`).join("")).join("");
  $("#nav").onclick = e => { const k = e.target.dataset.k; if (k) route(k); };
}
function route(k) {
  current = k;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.k === k));
  mainEl.onclick = null;
  const R = {dash: renderDash, journal: renderJournals, arInv: () => renderInvoices("AR"), apInv: () => renderInvoices("AP"),
             tb: renderTB, vat: renderVAT, balances: renderBalances, tools: renderTools};
  (R[k] || (() => renderList(k)))();
  try { history.replaceState(null, "", "#" + k); } catch (e) {}
}
load(); persist(); buildNav();
const start = location.hash.slice(1);
route(S[start] || ["dash","journal","arInv","apInv","tb","vat","balances","tools"].includes(start) ? start : "dash");
</script>
