<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akeed ERP</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#14284b;--navy2:#1c3561;--orange:#f08c1e;--bg:#f4f6fa;--line:#dfe3ea;--text:#1d2433;--muted:#6b7385;--ok:#1e8e3e;--bad:#c62828;--blue:#1565c0}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:265px;background:var(--navy);color:#fff;flex-shrink:0;overflow-y:auto;height:100vh;position:sticky;top:0}
aside h1{font-size:19px;margin:0;padding:18px 16px 12px}
aside h1 span{color:var(--orange)}
.navsearch{padding:0 12px 10px}
.navsearch input{background:var(--navy2);border:1px solid #2c4877;color:#fff}
.navsearch input::placeholder{color:#9fb0cf}
.gh{display:flex;align-items:center;gap:8px;padding:11px 16px;cursor:pointer;color:#e3eaf7;font-size:13.5px;font-weight:600;user-select:none;border-top:1px solid rgba(255,255,255,.06)}
.gh:hover{background:rgba(255,255,255,.05)}
.gh .ar{margin-inline-start:auto;transition:.2s;font-size:10px}
.ng.open .gh .ar{transform:rotate(-90deg)}
.gi{display:none;padding-bottom:8px}
.ng.open .gi{display:block}
.sh{padding:8px 26px 3px;font-size:11px;color:#8ea2c6}
aside a{display:block;padding:7px 42px 7px 16px;color:#e6ebf5;text-decoration:none;cursor:pointer;font-size:13px}
aside a:hover{background:rgba(255,255,255,.07)}
aside a.active{background:var(--orange);color:#fff}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.burger{display:none;font-size:18px;padding:4px 10px}
#crumb{font-size:13px;color:var(--muted)}
#crumb b{color:var(--text)}
#page{padding:22px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0;font-size:21px;margin-inline-end:auto}
.bar label{display:flex;align-items:center;gap:6px;font-size:13px}
.bar input[type=date]{width:auto}
.bar select{width:auto;min-width:220px}
.help{background:#eef4ff;border:1px solid #d6e2fb;color:#2b3f66;padding:10px 12px;border-radius:8px;margin:0 0 14px;font-size:13px;line-height:1.7}
button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:7px;cursor:pointer;font:inherit}
button:hover{border-color:#b9c0cf}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.acc{background:var(--orange);color:#fff;border-color:var(--orange)}
button.danger{color:var(--bad)}
button.sm{padding:3px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #c9d8f5;border-color:#7d9bd6}
input:disabled,select:disabled,textarea:disabled{background:#f3f4f7;color:#444}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:#eef1f7;font-weight:600;font-size:12px;color:#3b4560;position:sticky;top:0;z-index:1}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#fafbfe}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:68vh;background:#fff}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.badge{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block}
.b-draft,.b-hold{background:#fff3e0;color:#b45f06}.b-posted{background:#e6f4ea;color:var(--ok)}.b-rev,.b-error{background:#fde7e7;color:var(--bad)}
.b-ready{background:#e3f2fd;color:var(--blue)}.b-skip{background:#eceff1;color:#546e7a}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:min(1150px,100%);padding:20px}
.modal h3{margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.grid label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:13px}
.grid label.chk input{width:auto}
.req::after{content:" *";color:var(--bad)}
.err{background:#fde7e7;color:var(--bad);padding:9px 12px;border-radius:7px;margin:10px 0;white-space:pre-line}
.warn{background:#fff3e0;color:#8a4b00;padding:9px 12px;border-radius:7px;margin:10px 0;white-space:pre-line}
.toast{position:fixed;bottom:18px;left:18px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;display:none;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-top:3px solid var(--orange)}
.kpi span{color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;gap:12px;align-items:center;font-weight:600;text-align:start}
.tile:hover{border-color:var(--orange);box-shadow:0 3px 10px rgba(240,140,30,.12)}
.tile i{font-style:normal;font-size:24px}
.tile small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border-radius:20px;padding:5px 14px;font-size:13px}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.muted{color:var(--muted)}
.lines td{padding:4px}
.lines input,.lines select{padding:5px 7px}
.tot td{font-weight:700;background:#f7f8fb}
.ok{color:var(--ok)}.bad{color:var(--bad)}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{padding:7px 0;display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line)}
ul.check li:last-child{border:0}
ul.check li button{margin-inline-start:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv td:first-child{color:var(--muted);width:42%}
@media(max-width:900px){.two{grid-template-columns:1fr}}
@media(max-width:800px){
  aside{position:fixed;right:0;top:0;z-index:40;transform:translateX(100%);transition:.25s;box-shadow:-4px 0 20px rgba(0,0,0,.3)}
  aside.open{transform:none}
  .burger{display:inline-block}
  #page{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="aside"><h1>Akeed <span>ERP</span></h1>
    <div class="navsearch"><input id="navq" placeholder="ابحث عن شاشة..."></div>
    <nav id="nav"></nav></aside>
  <main>
    <header class="top"><button class="burger" id="burger">☰</button><span id="crumb"></span>
      <span class="muted" style="margin-inline-start:auto;font-size:12px">💾 الحفظ تلقائي في هذا المتصفح</span></header>
    <div id="page"></div>
  </main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" style="display:none">

<script>
"use strict";
/* =================== Helpers =================== */
const LS_KEY = "akeed_erp_v1";
const $ = s => document.querySelector(s);
const mainEl = $("#page"), modalEl = $("#modal");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmt = n => r2(n).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => new Date().toISOString().slice(0, 10);
const iso = d => d.toISOString().slice(0, 10);
const sum = (arr, k) => (arr || []).reduce((s, x) => s + (Number(x[k]) || 0), 0);
const addDays = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return iso(x); };
const up = v => String(v ?? "").trim().toUpperCase();
const digits = v => String(v ?? "").replace(/\D/g, "");
const tkKey = v => digits(v).slice(-10);
function num(v) { if (typeof v === "number") return v; const s = String(v ?? "").replace(/,/g, "").trim(); if (s === "") return null; const n = Number(s); return isNaN(n) ? null : n; }
function normDate(v) {
  if (typeof v === "number" && v > 20000 && v < 80000) return iso(new Date(Math.round((v - 25569) * 86400000)));
  const s = String(v ?? "").trim(); if (!s) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s); return isNaN(d) ? "" : iso(d);
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 2600); }
function showModal(html) { modalEl.innerHTML = html; modalEl.oninput = null; modalEl.onchange = null; modalEl.onclick = null; $("#mbg").style.display = "flex"; }
function closeModal() { $("#mbg").style.display = "none"; }
$("#mbg").addEventListener("click", e => { if (e.target.closest("[data-close]")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function download(name, text, type = "text/plain") {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function pickFile(accept, cb, binary = false) {
  const f = $("#filePick"); f.value = ""; f.accept = accept;
  f.onchange = () => {
    const file = f.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => cb(binary ? rd.result : String(rd.result), file.name);
    binary ? rd.readAsArrayBuffer(file) : rd.readAsText(file, "utf-8");
  };
  f.click();
}
const helpBox = t => t ? `<div class="help">💡 ${t}</div>` : "";

/* =================== Schema (Master data & simple docs) =================== */
const ACC_TYPES = [["ASSET","أصول"],["LIABILITY","خصوم"],["EQUITY","حقوق ملكية"],["REVENUE","إيرادات"],["EXPENSE","مصروفات"]];
const OUT = t => t.kind === "OUTPUT", INP = t => t.kind === "INPUT";
const STATUS = {k:"status", l:"الحالة", t:"status", ro:1, def:"DRAFT"};
const SVC_TYPES = [["HOTEL","فنادق"],["VISA","تأشيرات"],["INSURANCE","تأمين"],["TRANSPORT","نقل / سيارات"],["OTHER","أخرى"]];

const S = {
  company: {title:"الشركة", help:"بيانات الشركة اللي بتظهر على الفواتير. الرقم الضريبي مطلوب لفواتير ZATCA.", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم (EN)",req:1},{k:"nameAr",l:"الاسم (AR)"},
    {k:"vat",l:"الرقم الضريبي",pattern:"^3\\d{13}3$",hint:"15 رقم يبدأ وينتهي بـ 3"},
    {k:"cr",l:"السجل التجاري",list:false},{k:"city",l:"المدينة"},{k:"address",l:"العنوان",list:false},
    {k:"baseCurrency",l:"عملة الأساس",t:"ref",ref:"currency",req:1}]},
  currency: {title:"العملات", help:"العملات المستخدمة. عملة الأساس بتتحدد في شاشة الشركة.", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1,pattern:"^[A-Z]{3}$",hint:"3 حروف كبيرة"},{k:"name",l:"الاسم",req:1},
    {k:"decimals",l:"الكسور العشرية",t:"num",def:2,min:0}]},
  fxRate: {title:"أسعار الصرف", help:"سعر كل عملة مقابل عملة الأساس.", unique:[["currency","date"]], label:r => `${refCode("currency",r.currency)} ${r.date}`, fields:[
    {k:"currency",l:"العملة",t:"ref",ref:"currency",req:1},{k:"date",l:"التاريخ",t:"date",req:1,def:today},
    {k:"rate",l:"السعر مقابل عملة الأساس",t:"num",req:1,min:0.000001}]},
  numSeq: {title:"تسلسل الأرقام", help:"شكل الترقيم لكل نوع مستند. الرقم بيتحجز وقت الترحيل.", unique:["code"], fields:[
    {k:"code",l:"المستند",t:"enum",req:1,opts:[["JV","قيد يومية"],["INV","فاتورة عميل"],["CN","إشعار دائن عميل"],["VI","فاتورة مورد"],["VCN","إشعار دائن مورد"],["RCPT","سند قبض"],["PAY","سند صرف"],["SVC","حجز خدمة"],["ADM","ADM / ACM"]]},
    {k:"prefix",l:"البادئة",req:1},{k:"next",l:"الرقم التالي",t:"num",def:1,req:1,min:1},{k:"pad",l:"عدد الخانات",t:"num",def:6,min:1}]},
  fiscalYear: {title:"السنوات المالية", help:"لما تضيف سنة، الفترات الشهرية بتتعمل لوحدها.", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"start",l:"البداية",t:"date",req:1},{k:"end",l:"النهاية",t:"date",req:1}],
    validate: r => (r.end <= r.start ? "النهاية لازم تكون بعد البداية" : DB.fiscalYear.some(y => y.id !== r.id && y.start <= r.end && y.end >= r.start) ? "السنة متداخلة مع سنة أخرى" : null),
    afterSave: r => { if (!DB.period.some(p => p.year === r.id)) genPeriods(r); }},
  period: {title:"الفترات المالية", help:"افتح أو علّق أو اقفل الشهور. مفيش ترحيل في فترة مش مفتوحة.", noAdd:1, noDelete:1, label:r => `${refCode("fiscalYear",r.year)}-P${String(r.no).padStart(2,"0")}`, fields:[
    {k:"year",l:"السنة",t:"ref",ref:"fiscalYear",ro:1},{k:"no",l:"رقم الفترة",t:"num",ro:1},
    {k:"start",l:"من",t:"date",ro:1},{k:"end",l:"إلى",t:"date",ro:1},
    {k:"status",l:"الحالة",t:"enum",req:1,opts:[["OPEN","مفتوحة"],["ON_HOLD","معلّقة"],["CLOSED","مقفولة"]]}]},
  account: {title:"الحسابات الرئيسية", help:"دليل الحسابات. الحساب التجميعي (مش بيقبل ترحيل) بيكون أب للحسابات اللي تحته.", unique:["code"], sort:"code", fields:[
    {k:"code",l:"رقم الحساب",req:1},{k:"name",l:"الاسم (EN)",req:1},{k:"nameAr",l:"الاسم (AR)"},
    {k:"type",l:"النوع",t:"enum",opts:ACC_TYPES,req:1},{k:"parent",l:"الحساب الأب",t:"ref",ref:"account",filter:a => !a.posting},
    {k:"posting",l:"يقبل ترحيل",t:"bool",def:true},{k:"blocked",l:"موقوف",t:"bool",def:false},
    {k:"reqDim",l:"بُعد إجباري",t:"ref",ref:"dimension",list:false}],
    validate: r => r.parent === r.id ? "الحساب لا يكون أبًا لنفسه" : null},
  dimension: {title:"الأبعاد المالية", help:"تصنيفات إضافية للقيود (الإدارة، الفرع، نوع الخدمة).", unique:["code"], fields:[{k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1}]},
  dimValue: {title:"قيم الأبعاد", help:"القيم المسموحة لكل بُعد.", unique:[["dimension","code"]], label:r => `${refCode("dimension",r.dimension)}:${r.code} ${r.name}`, fields:[
    {k:"dimension",l:"البُعد",t:"ref",ref:"dimension",req:1},{k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},
    {k:"active",l:"نشط",t:"bool",def:true}]},
  taxCode: {title:"أكواد الضريبة", help:"كل كود مربوط بحساب الضريبة وبفئة ZATCA.", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},
    {k:"kind",l:"النوع",t:"enum",req:1,opts:[["OUTPUT","مخرجات (مبيعات)"],["INPUT","مدخلات (مشتريات)"]]},
    {k:"rate",l:"النسبة %",t:"num",req:1,min:0},
    {k:"zatca",l:"فئة ZATCA",t:"enum",req:1,opts:[["S","S - Standard"],["Z","Z - Zero rated"],["E","E - Exempt"],["O","O - Out of scope"]]},
    {k:"account",l:"حساب الضريبة",t:"ref",ref:"account",req:1}]},
  taxRegion: {title:"المناطق الضريبية", help:"بتحدد ضريبة المحلي والدولي. لو ملف التذاكر فيه كود منطقة (زي VA أو AC)، ضيفه هنا بنفس الكود وحدد نطاقه.", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الوصف",req:1},
    {k:"scope",l:"النطاق",t:"enum",req:1,opts:[["DOM","محلي"],["INTL","دولي"]]},
    {k:"outTax",l:"ضريبة المبيعات",t:"ref",ref:"taxCode",req:1,filter:OUT},
    {k:"inTax",l:"ضريبة المشتريات",t:"ref",ref:"taxCode",req:1,filter:INP},
    {k:"sfTax",l:"ضريبة رسوم الخدمة",t:"ref",ref:"taxCode",filter:OUT}]},
  airport: {title:"المطارات", help:"المطارات بتحدد إذا كانت الرحلة محلية ولا دولية. ضيف أسماء المدن زي ما بتيجي في الملف في خانة «أسماء بديلة».", unique:["code"], fields:[
    {k:"code",l:"كود IATA",req:1,pattern:"^[A-Z]{3}$"},{k:"name",l:"الاسم",req:1},{k:"city",l:"المدينة"},
    {k:"country",l:"الدولة (ISO)",req:1,pattern:"^[A-Z]{2}$",hint:"SA للسعودية"},
    {k:"aliases",l:"أسماء بديلة (بفاصلة)",list:false,hint:"مثال: JEDDAH,JEDDAH KING ABDUL"},
    {k:"region",l:"المنطقة الضريبية",t:"ref",ref:"taxRegion"}]},
  payTerm: {title:"شروط السداد", help:"عدد أيام الاستحقاق من تاريخ الفاتورة.", unique:["code"], fields:[{k:"code",l:"الكود",req:1},{k:"name",l:"الوصف"},{k:"days",l:"عدد الأيام",t:"num",def:0,min:0}]},
  payMethod: {title:"طرق الدفع", help:"كل طريقة دفع مربوطة بحساب. عمولة البوابة (%) والرسم الثابت بيتستخدموا في تسوية Moyasar وPayfort. الكود لازم يطابق اللي في ملف البوابة (VISA، MADA...).", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},
    {k:"kind",l:"النوع",t:"enum",req:1,opts:[["CASH","نقدي"],["BANK","تحويل بنكي"],["CARD","بطاقة (مدى/فيزا)"],["GATEWAY","بوابة دفع"],["CTA","AMEX CTA / GR"],["WALLET","محفظة"],["CHEQUE","شيك"]]},
    {k:"account",l:"الحساب",t:"ref",ref:"account",req:1},{k:"feePct",l:"عمولة %",t:"num",def:0,min:0},{k:"feeFixed",l:"رسم ثابت",t:"num",def:0,min:0},
    {k:"aliases",l:"أسماء بديلة (بفاصلة)",list:false,hint:"مثال: MASTERCARD,MC,APPLEPAY"}]},
  bank: {title:"البنوك", help:"حسابات الشركة في البنوك.", unique:["code"], fields:[
    {k:"code",l:"الكود",req:1},{k:"name",l:"اسم البنك",req:1},{k:"iban",l:"IBAN",pattern:"^SA\\d{22}$",hint:"SA + 22 رقم"},
    {k:"currency",l:"العملة",t:"ref",ref:"currency"},{k:"account",l:"الحساب",t:"ref",ref:"account",req:1}]},
  custGroup: {title:"مجموعات العملاء", help:"كل مجموعة بتحدد حساب الذمم المدينة للعملاء اللي فيها.", unique:["code"], fields:[{k:"code",l:"الكود",req:1},{k:"name",l:"الاسم",req:1},{k:"arAccount",l:"حساب الذمم المدينة",t:"ref",ref:"account",req:1}]},

function genPeriods(fy, db = DB) {
  let d = new Date(fy.start + "T00:00:00Z"); const end = new Date(fy.end + "T00:00:00Z"); let n = 1;
  while (d <= end) {
    const e = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)); const pe = e < end ? e : end;
    db.period.push({id: uid(), year: fy.id, no: n++, start: iso(d), end: iso(pe), status: "OPEN"});
    d = new Date(pe.getTime() + 86400000);
  }
}
function nextNo(code) {
  let s = DB.numSeq.find(x => x.code === code);
  if (!s) { s = {id: uid(), code, prefix: code + "-", next: 1, pad: 6}; DB.numSeq.push(s); }
  const n = Number(s.next) || 1; s.next = n + 1;
  return s.prefix + String(n).padStart(Number(s.pad) || 6, "0");
}

function show(f, v) {
  if (v === undefined || v === null || v === "") return "";
  switch (f.t) {
    case "ref": return refLabel(f.ref, v);
    case "enum": { const o = f.opts.find(x => x[0] === v); return o ? o[1] : v; }
    case "bool": return v ? "✓" : "—";
    case "num": return f.money ? fmt(v) : v;
    default: return v;
  }
}

/* =================== CSV / Excel =================== */

/* =================== GL posting engine =================== */
function L(acc, amt, extra = {}) {
  amt = r2(amt); if (!amt) return null;
  return {acc, dr: amt > 0 ? amt : 0, cr: amt < 0 ? -amt : 0, dim: "", cust: "", vend: "", tax: null, base: null, memo: "", ...extra};
}
const findPeriod = date => DB.period.find(p => p.start <= date && p.end >= date);
function validateJournal(j) {
  const e = [];

  if (!j.date) e.push("التاريخ مطلوب");
  else { const p = findPeriod(j.date); if (!p) e.push(`لا توجد فترة مالية للتاريخ ${j.date}`); else if (p.status !== "OPEN") e.push(`الفترة اللي فيها ${j.date} مش مفتوحة`); }
  if (lines.length < 2) e.push("القيد محتاج سطرين على الأقل");
  let dr = 0, cr = 0;
  lines.forEach((l, i) => {
    const n = i + 1, a = rec("account", l.acc);
    if (!a) { e.push(`سطر ${n}: الحساب مش موجود`); return; }
    if (!a.posting) e.push(`سطر ${n}: الحساب ${a.code} تجميعي ومش بيقبل ترحيل`);
    if (a.blocked) e.push(`سطر ${n}: الحساب ${a.code} موقوف`);
    const d = r2(l.dr), c = r2(l.cr);
    if (d < 0 || c < 0 || (d > 0) === (c > 0)) e.push(`سطر ${n}: لازم مدين أو دائن موجب (واحد بس)`);
    if (a.reqDim) { const dv = rec("dimValue", l.dim); if (!dv || dv.dimension !== a.reqDim) e.push(`سطر ${n}: الحساب ${a.code} محتاج بُعد ${refLabel("dimension", a.reqDim)}`); }
    dr += d; cr += c;
  });
  if (r2(dr) !== r2(cr)) e.push(`القيد مش متوازن: مدين ${fmt(dr)} / دائن ${fmt(cr)}`);
  return {errs: e, lines};
}
function postJournal(j) {
  const {errs, lines} = validateJournal(j);
  if (errs.length) throw new Error(errs.join("\n"));
  j.lines = lines.map(l => ({...l, dr: r2(l.dr), cr: r2(l.cr)}));
  j.number = j.number || nextNo("JV"); j.status = "POSTED"; j.postedAt = new Date().toISOString();
  if (!DB.journal.includes(j)) DB.journal.push(j);

}
function mkJournal(date, desc, lines, doc, type = "GENERAL") {
  const j = {id: uid(), date, type, desc, doc: doc || "", status: "DRAFT", lines: lines.filter(Boolean)};
  return postJournal(j);
}
function reverseJournal(j, date) {
  if (j.status !== "POSTED") throw new Error("القيد مش مرحّل");
  if (j.reversedBy) throw new Error("القيد معكوس بالفعل");
  const rv = {id: uid(), date, type: "REVERSAL", desc: `عكس القيد ${j.number}`, status: "DRAFT", source: j.number,
    lines: j.lines.map(l => ({...l, dr: l.cr, cr: l.dr, base: l.base != null ? -l.base : null}))};
  postJournal(rv); j.reversedBy = rv.number; return rv;
}
function controlAccount(ar, party) {

  const acc = g && (ar ? g.arAccount : g.apAccount);
  if (!acc) throw new Error(`مجموعة ${party.code} مش مربوطة بحساب رقابة`);
  return acc;
}
function postedLines(from, to) {
  const out = [];
  DB.journal.forEach(j => { if (j.status !== "POSTED" || (from && j.date < from) || (to && j.date > to)) return; j.lines.forEach(l => out.push({j, l})); });

}
function partyBalance(field, id) { return r2(postedLines().filter(({l}) => l[field] === id).reduce((s, {l}) => s + l.dr - l.cr, 0)); }
function withRollback(fn) { const snap = JSON.stringify(DB); try { return fn(); } catch (e) { DB = JSON.parse(snap); throw e; } }
const taxOf = id => rec("taxCode", id);

/* Payments */
function postPayment(p, ar) {
  if (p.status === "POSTED") throw new Error("السند مرحّل بالفعل");
  const party = rec(ar ? "customer" : "vendor", ar ? p.customer : p.vendor), m = rec("payMethod", p.method);
  if (!party || !m) throw new Error("بيانات السند ناقصة");
  if (party.blocked) throw new Error(`${party.code} موقوف`);
  if (!(Number(p.amount) > 0)) throw new Error("المبلغ لازم يكون موجب");
  const ctrl = controlAccount(ar, party), amt = r2(p.amount);
  const lines = ar ? [L(m.account, amt), L(ctrl, -amt, {cust: party.id})] : [L(ctrl, amt, {vend: party.id}), L(m.account, -amt)];
  const j = mkJournal(p.date, `${ar ? "قبض من" : "صرف إلى"} ${party.name}${p.ref ? " — " + p.ref : ""}`, lines, "", ar ? "RCPT" : "PAY");
  p.jv = j.number; p.number = nextNo(ar ? "RCPT" : "PAY"); p.status = "POSTED"; j.doc = p.number;
}

/* Invoices */
function invTotals(inv) {
  let net = 0, tax = 0;
  inv.lines.forEach(l => { const n = r2((+l.qty || 0) * (+l.price || 0)), t = taxOf(l.tax); net += n; tax += t ? r2(n * t.rate / 100) : 0; });
  return {net: r2(net), tax: r2(tax), total: r2(net + tax)};
}
function postInvoice(kind, inv) {
  const ar = kind === "AR", key = ar ? "arInv" : "apInv";

  if (!inv.date) e.push("التاريخ مطلوب");
  const lines = inv.lines.filter(l => l.item || l.acc || Number(l.price));
  if (!lines.length) e.push("المستند من غير سطور");
  const tk = ar ? "OUTPUT" : "INPUT";
  lines.forEach((l, i) => {
    if (!rec("account", l.acc)) e.push(`سطر ${i + 1}: اختار الحساب`);
    if (r2((+l.qty || 0) * (+l.price || 0)) <= 0) e.push(`سطر ${i + 1}: المبلغ لازم يكون موجب (المرتجع بيتعمل إشعار دائن)`);
    const t = taxOf(l.tax); if (t && t.kind !== tk) e.push(`سطر ${i + 1}: كود الضريبة ${t.code} مش مناسب للمستند ده`);
  });
  if (inv.cn && inv.original) {
    const o = DB[key].find(x => x.id === inv.original);
    if (!o || o.status !== "POSTED" || o.cn || o.party !== inv.party) e.push("الفاتورة الأصلية مش صالحة للإشعار ده");
  }
  if (e.length) throw new Error(e.join("\n"));
  const ctrl = controlAccount(ar, party);
  const sign = inv.cn ? -1 : 1, flow = ar ? sign : -sign;
  const jl = []; let total = 0;
  lines.forEach(l => {
    const n = r2(l.qty * l.price), t = taxOf(l.tax), tx = t ? r2(n * t.rate / 100) : 0;
    jl.push(L(l.acc, -n * flow, {tax: t ? t.id : null, base: t ? r2(n * sign) : null, memo: l.desc || ""}));
    if (t && tx) jl.push(L(t.account, -tx * flow, {tax: t.id, base: null, memo: "VAT " + t.code}));
    total += n + tx;
  });
  total = r2(total);
  if (ar && !inv.cn && Number(party.creditLimit) > 0 && partyBalance("cust", party.id) + total > Number(party.creditLimit))
    throw new Error(`العميل ${party.code} هيعدّي حد الائتمان (الرصيد ${fmt(partyBalance("cust", party.id))} + ${fmt(total)} > ${fmt(party.creditLimit)})`);
  jl.push(L(ctrl, total * flow, ar ? {cust: party.id} : {vend: party.id}));
  const j = mkJournal(inv.date, `${inv.cn ? "إشعار دائن" : "فاتورة"} ${party.name}${inv.ticket ? " — " + inv.ticket : ""}`, jl, "", ar ? "AR" : "AP");
  const term = rec("payTerm", party.payTerm);
  inv.lines = lines;
  inv.due = inv.due || addDays(inv.date, term ? Number(term.days) || 0 : 0);
  inv.number = nextNo(ar ? (inv.cn ? "CN" : "INV") : (inv.cn ? "VCN" : "VI"));

  if (inv.cn && inv.original) {

  }
}

/* =================== Settlement (AR / AP) =================== */
const sKey = side => side === "AR" ? {inv:"arInv", pay:"receipt", pf:"customer", ent:"customer", lf:"cust", nm:"العميل"} : {inv:"apInv", pay:"vendPayment", pf:"vendor", ent:"vendor", lf:"vend", nm:"المورد"};

function openOf(type, doc) {

}

/* =================== Router & boot =================== */
function buildNav() {
  const q = up($("#navq").value);
  $("#nav").innerHTML = NAV.map(mod => {
    const secs = mod.s.map(([sh, items]) => [sh, items.filter(([k, l]) => !q || up(l).includes(q) || up(mod.g).includes(q))]).filter(([, it]) => it.length);
    if (!secs.length) return "";
    const open = q || openGroups.has(mod.g) || secs.some(([, it]) => it.some(([k]) => k === current));
    return `<div class="ng${open ? " open" : ""}"><div class="gh" data-g="${esc(mod.g)}"><span>${mod.ic}</span>${mod.g}<span class="ar">◀</span></div>
      <div class="gi">${secs.map(([sh, it]) => (sh ? `<div class="sh">${SEC_IC[sh] || ""} ${sh}</div>` : "") + it.map(([k, l]) => `<a data-k="${k}" class="${k === current ? "active" : ""}">${l}</a>`).join("")).join("")}</div></div>`;
  }).join("");
}
$("#nav").onclick = e => {
  const a = e.target.closest("a[data-k]"); if (a) { route(a.dataset.k); $("#aside").classList.remove("open"); return; }
  const h = e.target.closest(".gh"); if (h) { const g = h.dataset.g; openGroups.has(g) ? openGroups.delete(g) : openGroups.add(g); buildNav(); }
};
$("#navq").oninput = buildNav;
$("#burger").onclick = () => $("#aside").classList.toggle("open");
function route(k) {
  current = k;
  const pg = PAGES[k]; if (pg) openGroups.add(pg.g);
  buildNav();
  $("#crumb").innerHTML = pg ? `${esc(pg.g)}${pg.s ? " ‹ " + esc(pg.s) : ""} ‹ <b>${esc(pg.l)}</b>` : "";
  mainEl.onclick = null;
  const R = {dash: renderDash, journal: renderJournals, arInv: () => renderInvoices("AR"), apInv: () => renderInvoices("AP"),
    tb: renderTB, ledger: renderLedger, vat: renderVAT, balances: renderBalances, tools: renderTools,
    flights: renderFlights, flightSettings: renderFlightSettings, salesReport: renderSalesReport, productivity: renderProductivity,
    svcReport: renderSvcReport, gateway: () => renderStmt("GW"), amex: () => renderStmt("AMEX"), bsp: () => renderStmt("BSP"),
    reconReport: renderReconReport, paySettings: renderPaySettings,
    arSettle: () => renderSettle("AR"), apSettle: () => renderSettle("AP"), custStatement: () => renderStatement("AR"), vendStatement: () => renderStatement("AP"),
    arAging: () => renderAging("AR"), apAging: () => renderAging("AP")};
  (R[k] || (() => renderList(k)))();
  window.scrollTo(0, 0);
  try { history.replaceState(null, "", "#" + k); } catch (e) {}
}
load(); persist();
const start = location.hash.slice(1);
route(PAGES[start] ? start : "dash");
