<style>
:root{--top:#0b1f3f;--blue:#0f6cbd;--blue-d:#115ea3;--bg:#f5f5f5;--line:#e1dfdd;--line2:#c8c6c4;--text:#201f1e;--muted:#605e5c;--hover:#f3f2f1;--sel:#e1effa;--ok:#107c10;--bad:#a4262c}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,Tahoma,Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
.topbar{height:48px;background:var(--top);color:#fff;display:flex;align-items:center;gap:6px;padding:0 6px;position:sticky;top:0;z-index:80}
.tb-btn{background:none;border:0;color:#fff;font-size:17px;min-width:40px;height:40px;cursor:pointer;border-radius:2px;padding:0 8px;font-family:inherit}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.brand{font-size:15px;font-weight:600;white-space:nowrap;padding:0 6px}
.brand small{font-weight:400;opacity:.8;margin-inline-start:10px;font-size:14px}
.tb-search{flex:1;max-width:540px;margin:0 auto;position:relative}
.tb-search input{width:100%;height:32px;border:1px solid transparent;border-radius:4px;background:rgba(255,255,255,.14);color:#fff;padding:0 12px;font:inherit}
.tb-search input::placeholder{color:#d0d7e2}
.tb-search input:focus{background:#fff;color:var(--text);outline:none}
.tb-right{display:flex;align-items:center;gap:2px;position:relative}
.le-btn{background:transparent;color:#fff;border:1px solid #fff;height:28px;padding:0 12px;border-radius:2px;cursor:pointer;font:inherit;font-weight:600;letter-spacing:.5px}
.le-btn:hover{background:rgba(255,255,255,.15)}
.avatar{width:32px;height:32px;border-radius:50%;background:#c7e0f4;color:#004578;display:grid;place-items:center;font-size:12px;font-weight:700;margin-inline-start:6px}
.dropdown{position:absolute;top:40px;background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18);min-width:290px;display:none;z-index:90;max-height:60vh;overflow:auto}
#leMenu{inset-inline-end:0}
#psResults{inset-inline-start:0;width:100%}
.dropdown a{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;cursor:pointer;color:var(--text);text-decoration:none}
.dropdown a:hover{background:var(--hover)}
.dropdown a small{color:var(--muted)}
.dropdown a.sep{border-top:1px solid var(--line);color:var(--blue)}
.dropdown a.cur{background:var(--sel);font-weight:600}
.shell{display:flex}
.navpane{width:260px;background:#fff;border-inline-end:1px solid var(--line);flex-shrink:0;height:calc(100vh - 48px);overflow-y:auto;position:sticky;top:48px}
.np-hidden .navpane{display:none}
.np-sec{border-bottom:1px solid #f0f0f0}
.np-head{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;user-select:none;font-weight:600}
.np-head:hover{background:var(--hover)}
.np-ic{width:20px;text-align:center}
.np-ar{margin-inline-start:auto;font-size:11px;color:var(--muted)}
.np-sec:not(.open) .np-body{display:none}
.np-link,.np-mod{display:flex;gap:10px;align-items:center;padding:8px 16px;padding-inline-start:48px;cursor:pointer;color:var(--text);text-decoration:none;border-inline-start:3px solid transparent}
.np-mod{padding-inline-start:30px}
.np-link:hover,.np-mod:hover{background:var(--hover)}
.np-link.on,.np-mod.on{background:var(--sel);border-inline-start-color:var(--blue);font-weight:600}
.np-empty{padding:8px 16px;padding-inline-start:48px;color:var(--muted);font-size:12px}
.flyout{position:fixed;top:48px;inset-inline-start:260px;width:min(780px,calc(100vw - 280px));height:calc(100vh - 48px);background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:70;display:none;overflow:auto;padding:14px 26px}
.np-hidden .flyout{inset-inline-start:0}
.fo-title{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fo-title button{margin-inline-start:auto;border:0;background:none;font-size:16px;cursor:pointer}
.fo-top{display:flex;gap:6px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.fo-top button{background:none;border:0;color:var(--text);padding:6px 10px;cursor:pointer;font:inherit;min-height:0}
.fo-top button:hover{background:var(--hover)}
.fo-cols{columns:2 300px;column-gap:36px}
.fo-grp{break-inside:avoid;margin-bottom:14px}
.fo-gh{font-weight:600;cursor:pointer;padding:6px 0;display:flex;gap:8px;align-items:center;user-select:none}
.fo-gi a{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;padding-inline-start:22px;color:var(--blue);cursor:pointer;text-decoration:none}
.fo-gi a:hover{background:var(--hover)}
.fo-gi a:hover span:first-child{text-decoration:underline}
.star{color:#a19f9d;font-size:15px}
.star.on{color:#c19c00}
main{flex:1;min-width:0}
#page{padding-bottom:40px}
#page>*:not(.bar){margin-inline:24px}
#page>.bar+*{margin-top:16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:4px 16px 0;position:sticky;top:48px;z-index:30;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bar>h2{order:99;flex-basis:100%;margin:6px 4px 12px;font-size:24px;font-weight:400;color:var(--text)}
.bar button{background:none;border:0;padding:7px 10px;color:var(--text);border-radius:2px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.bar button:hover:not(:disabled){background:var(--hover)}
.bar button.pri,.bar button.pri:not(:disabled){color:var(--blue);font-weight:600;background:none;border-color:transparent}
.bar button.pri:hover:not(:disabled){background:var(--hover)}
.dimseg{display:flex;gap:4px;flex-wrap:nowrap}.dimseg label{display:flex;flex-direction:column;gap:1px;margin:0}.dimseg small{font-size:10px;color:var(--muted)}.dimseg select{min-width:96px;padding:3px 4px;font-size:12px}
.dm-c{cursor:pointer;text-align:center;user-select:none;min-width:70px}.dm-c.req{background:#dff3e4;color:#0f7b3f;font-weight:700}.dm-c.opt{background:#fff6d6;color:#8a6100}.dm-c:hover{outline:1px solid var(--blue)}
.bar button.acc{color:#fff;background:var(--blue);margin-inline:4px}
.bar button.acc:hover:not(:disabled){background:var(--blue-d)}
.bar button.danger{color:var(--bad)}
.bar button:disabled{opacity:.45;cursor:default}
.bar input,.bar select{width:auto;min-width:170px;margin-inline:4px}
.bar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-inline:4px}
.ap-back{font-size:18px!important;border-inline-end:1px solid var(--line)!important;border-radius:0!important;margin-inline-end:6px}
.help{background:#f3f9fd;border:1px solid #c7e0f4;border-inline-start:4px solid var(--blue);color:#323130;padding:9px 12px;margin-bottom:14px;font-size:13px;line-height:1.7}
button{font:inherit;cursor:pointer;border:1px solid #8a8886;background:#fff;color:var(--text);padding:5px 16px;border-radius:2px;min-height:32px}
button:hover{background:var(--hover)}
button.pri,button.acc{background:var(--blue);border-color:var(--blue);color:#fff}
button.pri:hover,button.acc:hover{background:var(--blue-d)}
button.danger{color:var(--bad)}
button.sm{padding:1px 10px;font-size:12px;min-height:24px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;height:32px;padding:4px 8px;border:1px solid #8a8886;border-radius:2px;background:#fff;width:100%;color:var(--text)}
textarea{height:auto}
input[type=checkbox],input[type=radio]{width:auto;height:auto}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
input:disabled,select:disabled,textarea:disabled{background:#f3f2f1;color:#605e5c;border-color:#c8c6c4}
.card{background:#fff;border:1px solid var(--line);border-radius:2px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:-14px -18px 12px;padding:10px 18px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line)}
.tbl{overflow:auto;border:1px solid var(--line);background:#fff;max-height:66vh}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:6px 10px;border-bottom:1px solid #edebe9;text-align:start;white-space:nowrap;height:34px}
th{font-weight:600;font-size:13px;background:#fff;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line2)}
tbody tr.click{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.click td:first-child{color:var(--blue)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.tot td{font-weight:700;background:#faf9f8}
.badge{padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;display:inline-block}
.b-draft,.b-hold{background:#fff4ce;color:#8a5300}.b-posted{background:#dff6dd;color:#107c10}.b-rev,.b-error{background:#fde7e9;color:#a4262c}.b-ready{background:#deecf9;color:#0f6cbd}.b-skip{background:#f3f2f1;color:#605e5c}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:100}
.modal{background:#fff;width:min(1150px,100%);padding:20px 24px;box-shadow:0 25px 50px rgba(0,0,0,.25);border-radius:2px}
.modal h3{margin:0 0 16px;font-size:20px;font-weight:600}
.modal .bar{position:static;box-shadow:none;border:0;padding:0;background:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 18px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.grid label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:13px}
.mf{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.multi{display:flex;flex-wrap:wrap;gap:6px 20px;border:1px solid var(--line2);padding:8px 10px;max-height:180px;overflow:auto;color:var(--text);font-size:13px}
.multi label{display:flex;gap:6px;align-items:center}
.req::after{content:" *";color:var(--bad)}
.err{background:#fde7e9;color:var(--bad);padding:9px 12px;margin:10px 0;white-space:pre-line;border-inline-start:4px solid var(--bad)}
.warn{background:#fff4ce;color:#8a5300;padding:9px 12px;margin:10px 0;white-space:pre-line;border-inline-start:4px solid #c19c00}
.toast{position:fixed;bottom:18px;inset-inline-start:18px;background:#323130;color:#fff;padding:11px 18px;display:none;z-index:120;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);padding:14px 16px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:26px;font-weight:300;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--blue);color:#fff;border:0;border-radius:2px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:110px;text-align:start;font-weight:600}
.tile:hover{background:var(--blue-d)}
.tile i{font-style:normal;font-size:22px}
.tile small{display:block;font-weight:400;opacity:.9;font-size:12px;margin-top:4px}
.chips{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:10px;border-bottom:1px solid var(--line)}
.chips button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;border-radius:0;min-height:0}
.chips button.on{border-bottom-color:var(--blue);font-weight:600}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.muted{color:var(--muted)}
.lines td{padding:3px 4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{padding:7px 0;display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line)}
ul.check li:last-child{border:0}
ul.check li button{margin-inline-start:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv td:first-child{color:var(--muted);width:42%}
.fs td.sub{padding-inline-start:28px}
.fs tr.hd td{font-weight:600;background:#faf9f8}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.langs label{border:1px solid var(--line2);padding:14px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:15px}
.langs label.on{border-color:var(--blue);background:var(--sel)}
@media(max-width:900px){.two{grid-template-columns:1fr}}
@media(max-width:860px){
  .navpane{position:fixed;inset-inline-start:0;top:48px;z-index:75;display:none;box-shadow:0 0 20px rgba(0,0,0,.3)}
  .np-open .navpane{display:block}
  .flyout{inset-inline-start:0;width:100vw}
  .brand small,.tb-search{display:none}
  #page>*:not(.bar){margin-inline:12px}
}
</style>

  const ln = l => ({item: l.item || "", desc: l.desc || "", acc: l.acc, qty: l.qty, price: l.price, tax: l.tax || ""});
  if (!orig.shareCnNo) { const cn = {id: uid(), date: x.m.issueDate || today(), party: orig.party, cn: true, original: orig.id, ref: "AR sharing " + x.m.ticket, notes: "إلغاء الفاتورة الأصلية بسبب AR sharing", ticket: x.m.ticket, status: "DRAFT", lines: orig.lines.map(ln)};
    postInvoice("AR", cn); DB.arInv.push(cn); orig.shareCnNo = cn.number; }
  lines.forEach(l => { const c = byCode("customer", l.customer); if (!c) throw new Error("العميل مش موجود: " + l.customer);
    const ratio = nz(l.total) / ot, inv = {id: uid(), date: x.m.issueDate || today(), party: c.id, cn: false, original: "", ticket: x.m.ticket, status: "DRAFT", notes: `AR sharing ${l.shareType}${l.emp ? " — " + l.emp : ""}`,
      lines: orig.lines.map(o => ({...ln(o), qty: 1, price: r2(nz(o.qty) * nz(o.price) * ratio)}))};
    const f0 = inv.lines[0], base = f0.price; let best = base, bg = Infinity; for (let k = -5; k <= 5; k++) { f0.price = r2(base + k / 100); const g = Math.abs(r2(nz(l.total) - invTotals(inv).total)); if (g < bg - 1e-9) { bg = g; best = f0.price; } } f0.price = best;
    l.so = nextNo("SO-AR"); inv.ref = l.so; postInvoice("AR", inv); DB.arInv.push(inv);

  x.docs = [...new Set([...(x.docs || []), orig.shareCnNo])];
}

<script>
/* ===================================================================
   PART 6 — Fiscal calendar automation, ledger calendar (period close +
   module access), dimension values / derived dimensions, account
   structures + per-account dimension matrix, Ledger page, multiple COAs.
   =================================================================== */
(() => {
const NOW = () => today();
const addY = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCFullYear(x.getUTCFullYear() + n); return iso(x); };
const prevDay = d => iso(new Date(new Date(d + "T00:00:00Z").getTime() - 86400000));
const nextDay = d => iso(new Date(new Date(d + "T00:00:00Z").getTime() + 86400000));
const MODV = [["ALL", "<الكل>"], ["NONE", "ممنوع"]];
const STV = [["OPEN", "مفتوحة"], ["ON_HOLD", "معلّقة (On hold)"], ["CLOSED", "مقفولة نهائياً"]];
const perName = p => (p.type || "OPER") === "OPENING" ? "افتتاحية (0)" : p.type === "CLOSING" ? "إقفال" : "الفترة " + p.no;
const perSort = (a, b) => (a.type === "OPENING" ? -1 : 0) - (b.type === "OPENING" ? -1 : 0) || (a.type === "CLOSING" ? 1 : 0) - (b.type === "CLOSING" ? 1 : 0) || a.no - b.no;
const onEntity = (id, fn) => { const prev = STORE.cur; STORE.cur = id; try { return fn(); } finally { STORE.cur = prev; } };

/* ---------- fiscal years: migration + automatic next year ---------- */
function migratePeriods() {
  DB.period.forEach(p => { if (!p.type) p.type = "OPER"; PMODS.forEach(([k]) => { if (!p[k]) p[k] = "ALL"; }); });
  DB.fiscalYear.forEach(fy => { const ps = DB.period.filter(p => p.year === fy.id);
    if (!ps.some(p => p.type === "OPENING")) DB.period.push({id: uid(), year: fy.id, no: 0, type: "OPENING", start: fy.start, end: fy.start, status: "OPEN", ...PMOD_ALL()});
    if (!ps.some(p => p.type === "CLOSING")) DB.period.push({id: uid(), year: fy.id, no: Math.max(0, ...ps.map(p => p.no)) + 1, type: "CLOSING", start: fy.end, end: fy.end, status: "OPEN", ...PMOD_ALL()}); });
}
function createNextYear() {
  const ys = [...DB.fiscalYear].sort((a, b) => a.start.localeCompare(b.start)), last = ys[ys.length - 1];
  const start = last ? nextDay(last.end) : NOW().slice(0, 4) + "-01-01", end = last ? prevDay(addY(start, 1)) : NOW().slice(0, 4) + "-12-31";
  let code = last && /^\d+$/.test(last.code) ? String(Number(last.code) + 1) : start.slice(0, 4); if (DB.fiscalYear.some(y => y.code === code)) code = start.slice(0, 4) + "-" + end.slice(0, 4);
  const fy = {id: uid(), code, start, end, auto: true}; DB.fiscalYear.push(fy); genPeriods(fy); return fy;
}
function autoYears() {
  const made = []; let guard = 0;
  const latestEnd = () => DB.fiscalYear.reduce((m, y) => y.end > m ? y.end : m, "");
  while (guard++ < 10 && (!DB.fiscalYear.length || latestEnd() < NOW())) made.push(createNextYear());
  const le = latestEnd(), lim = iso(new Date(new Date(NOW() + "T00:00:00Z").getTime() + 60 * 86400000));
  if (le && le <= lim) made.push(createNextYear());
  return made;
}
function newYear(manual) {
  const fy = withRollback(() => createNextYear()); persist(); if (manual) { toast(`اتعملت السنة ${fy.code} (${fy.start} → ${fy.end}) بفتراتها`); route(current); } return fy;
}
STORE.global.company.forEach(c => onEntity(c.id, () => { migratePeriods(); const m = autoYears(); if (m.length) DB._autoYears = m.map(y => y.code); }));

/* ---------- dimensions helpers ---------- */
function syncDim(dimId) {
  const dm = rec("dimension", dimId); if (!dm) throw new Error("البُعد مش موجود");
  if (!dm.useFrom || dm.useFrom === "CUSTOM") throw new Error("البُعد ده «مخصص» — القيم بتدخلها بإيدك من «قيم الأبعاد»");
  let n = 0; (DB[dm.useFrom] || []).forEach(r => { if (!r.code) return; const ex = DB.dimValue.find(v => v.dimension === dimId && up(v.code) === up(r.code));
    if (ex) ex.name = r.name || ex.name; else { DB.dimValue.push({id: uid(), dimension: dimId, code: r.code, name: r.name || r.code, active: true, src: r.id}); n++; } });
  toast(`اتضافت ${n} قيمة من ${pt(dm.useFrom)}`); return n;
}
function applyStruct(id) {
  const st = rec("accStruct", id); if (!st) throw new Error("الهيكل مش موجود"); let n = 0;
  DB.account.filter(a => a.posting && (!st.accFrom || String(a.code) >= String(st.accFrom)) && (!st.accTo || String(a.code) <= String(st.accTo))).forEach(a => {
    a.dims = {}; (st.dims || []).forEach(d => a.dims[d] = (st.blank || []).includes(d) ? "OPT" : "REQ"); n++; });
  toast(`اتطبّق الهيكل ${st.code} على ${n} حساب`); return n;
}

/* ---------- ledger calendar (period close + module access) ---------- */
function renderCal() {
  const ys = [...DB.fiscalYear].sort((a, b) => b.start.localeCompare(a.start)), cy = DB.fiscalYear.find(y => y.start <= NOW() && y.end >= NOW());
  if (!UI.calYear || !rec("fiscalYear", UI.calYear)) UI.calYear = (cy || ys[0] || {}).id || "";
  const fy = rec("fiscalYear", UI.calYear), ps = DB.period.filter(p => p.year === UI.calYear).sort(perSort), sel = UI.calSel || (UI.calSel = {});
  const jc = p => DB.journal.filter(j => j.status === "POSTED" && j.date >= p.start && j.date <= p.end).length;
  const opt = (arr, v) => arr.map(([a, b]) => `<option value="${a}"${a === v ? " selected" : ""}>${b}</option>`).join("");
  mainEl.innerHTML = `<div class="bar"><h2></h2><button class="pri" id="ny">＋ السنة التالية</button><span class="sep"></span>
    <label style="flex-direction:row;align-items:center;gap:6px">تحديث حالة الفترة<select id="bst"><option value="">—</option>${opt(STV)}</select></label><button id="bstGo">تطبيق على المحدد</button><span class="sep"></span>
    <label style="flex-direction:row;align-items:center;gap:6px">تحديث صلاحية الموديول<select id="bmod">${PMODS.map(m => `<option value="${m[0]}">${m[1]}</option>`).join("")}<option value="*">كل الموديولات</option></select><select id="bmv">${opt(MODV)}</select></label><button id="bmGo">تطبيق على المحدد</button></div>
  ${helpBox("زي Ledger calendars في D365: اختار السنة، وكل شهر ليه حالة: <b>مفتوحة</b> (ترحيل عادي)، <b>معلّقة</b> (On hold — متوقفة مؤقتاً ويمكن تفتحها تاني)، <b>مقفولة</b> (نهائي ومينفعش تتفتح). وكمان تقدر تمنع موديول معيّن في فترة مفتوحة (مثلاً تقفل العملاء والموردين وتسيب دفتر الأستاذ مفتوح لقيود التسويات). الفترة الافتتاحية للأرصدة الافتتاحية، وفترة الإقفال لقيد إقفال السنة.")}
  <div class="ld-wrap" style="display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start">
   <div class="card" style="padding:10px"><label>السنة المالية<select id="cy">${ys.map(y => `<option value="${y.id}"${y.id === UI.calYear ? " selected" : ""}>${esc(y.code)}${y.auto ? " (تلقائي)" : ""}</option>`).join("")}</select></label>
    ${fy ? `<div class="muted" style="margin-top:8px;font-size:12px">من ${fy.start}<br>إلى ${fy.end}<br>${ps.filter(p => p.status === "CLOSED").length} مقفولة · ${ps.filter(p => p.status === "ON_HOLD").length} معلّقة · ${ps.filter(p => p.status === "OPEN").length} مفتوحة</div>` : ""}
    ${DB._autoYears ? `<div class="ok" style="margin-top:8px;font-size:12px">✓ اتعملت تلقائياً: ${esc(DB._autoYears.join("، "))}</div>` : ""}</div>
   <div class="tbl"><table><thead><tr><th><input type="checkbox" id="all"></th><th>الفترة</th><th>من</th><th>إلى</th><th class="num">قيود مرحّلة</th><th>حالة الفترة</th>${PMODS.map(m => `<th>${m[1]}</th>`).join("")}<th></th></tr></thead><tbody>
   ${ps.map(p => `<tr data-p="${p.id}" class="${p.status === "CLOSED" ? "muted" : ""}"><td><input type="checkbox" data-ck="${p.id}"${sel[p.id] ? " checked" : ""}></td><td><b>${perName(p)}</b></td><td>${p.start}</td><td>${p.end}</td><td class="num">${jc(p)}</td>
     <td><select data-st="${p.id}"${p.status === "CLOSED" ? " disabled" : ""}>${opt(STV, p.status)}</select></td>
     ${PMODS.map(m => `<td><select data-m="${m[0]}" data-pid="${p.id}"${p.status === "CLOSED" ? " disabled" : ""} class="${p[m[0]] === "NONE" ? "bad" : ""}">${opt(MODV, p[m[0]] || "ALL")}</select></td>`).join("")}
     <td>${p.status === "OPEN" && (p.type || "OPER") === "OPER" ? `<button class="sm" data-close1="${p.id}">🔒 اقفل الشهر</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="12"><div class="empty">مفيش فترات</div></td></tr>`}</tbody></table></div></div>`;
  const setSt = (p, st) => { if (p.status === "CLOSED" && st !== "CLOSED") throw new Error(`${perName(p)} مقفولة نهائياً ومينفعش تتفتح (زي D365)`); p.status = st; };
  mainEl.onchange = e => { const el = e.target;
    if (el.id === "cy") { UI.calYear = el.value; UI.calSel = {}; return route(current); }
    if (el.id === "all") { ps.forEach(p => sel[p.id] = el.checked); return route(current); }
    if (el.dataset.ck) { sel[el.dataset.ck] = el.checked; return; }
    try {
      if (el.dataset.st) { const p = rec("period", el.dataset.st); if (el.value === "CLOSED" && !confirm(`قفل ${perName(p)} نهائي ومش هينفع يتفتح تاني. متأكد؟`)) return route(current); setSt(p, el.value); }
      if (el.dataset.m) { rec("period", el.dataset.pid)[el.dataset.m] = el.value; }

    } catch (err) { alert(err.message); route(current); } };
  mainEl.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    const chosen = ps.filter(p => sel[p.id]);
    try {
      if (b.id === "ny") return newYear(true);
      if (b.dataset.close1) { const p = rec("period", b.dataset.close1); p.status = "ON_HOLD"; persist(); toast(`${perName(p)} اتعلّقت (On hold) — تقدر تقفلها نهائي من القائمة`); return route(current); }
      if (b.id === "bstGo") { const st = $("#bst").value; if (!st) return alert("اختار الحالة"); if (!chosen.length) return alert("حدد فترات الأول");

/* ---------- account dimensions matrix (like the Excel sheet) ---------- */

  ${helpBox("زي ملف Account dimensions: اضغط على الخانة عشان تغيّر حالتها: فاضية (البُعد مش بيظهر) ← <b class='ok'>✓ إجباري</b> ← <b style='color:#8a6100'>✓ يسمح بالفراغ</b> ← فاضية. الأبعاد اللي عليها علامة بس هي اللي بتظهر في سطر القيد للحساب ده. الخانات الباهتة جاية من «هيكل الحسابات» لحد ما تخصّص الحساب.")}
  <div class="tbl"><table><thead><tr><th>الحساب</th><th>الاسم</th><th>النوع</th><th>الهيكل</th>${dims.map(d => `<th class="dm-h" title="${esc(d.name)}">${esc(d.name)}</th>`).join("")}</tr></thead><tbody>

function remapEntity(oldCoa, newCoa) {

<script>
/* PART 7 — prepayment posting profiles + IATA BSP billing statement reader */
(() => {
/* IATA BSP "Agent Billing Details" (FCAGBILLDET) text parser.
   Input: text of the billing PDF (one text item per line, as exported by BSPlink / pdf text tools).
   Output: {hdr, docs[], totals{cat:{section:{...}}}, summary{cat:{...}}, checks[]} */
function parseBspBilling(text) {
  const NUM = /^-?[\d,]+\.\d{2}\*?$/, n = s => Number(String(s).replace(/[,*]/g, "")), r2 = x => Math.round(x * 100) / 100;
  const MON = {JAN:"01",FEB:"02",MAR:"03",APR:"04",MAY:"05",JUN:"06",JUL:"07",AUG:"08",SEP:"09",OCT:"10",NOV:"11",DEC:"12"};
  const dIso = s => { const m = /^(\d{2})([A-Z]{3})(\d{2})$/.exec(s); return m ? `20${m[3]}-${MON[m[2]]}-${m[1]}` : ""; };
  const dIso4 = s => { const m = /(\d{2})-([A-Z]{3})-(\d{4})/.exec(s); return m ? `${m[3]}-${MON[m[2]]}-${m[1]}` : ""; };
  const PEN_CODES = ["CP", "MF"], FOPS = ["CA", "CC", "EX", "MS", "CM", "VD", "EP"];
  const isCode = t => ((/^[A-Z0-9]{2}$/.test(t) && /[A-Z]/.test(t)) || /^OB[A-Z0-9]{3}$/.test(t)) && !FOPS.includes(t);
  const lines = String(text).replace(/\r/g, "").split("\n").map(s => s.trim());
  const hdr = {}, docs = [], totals = {}, summary = {}, checks = [];
  let cat = "", sec = "", cur = null, inPageHdr = false, seenDetail = false;
  const TOT10 = ["ta","fare","tax","fc","pen","cobl","std","supp","taxComm","bp"];
  const totOf = arr => Object.fromEntries(TOT10.map((k, i) => [k, n(arr[i] || 0)]));
  const close = () => { if (cur) { finish(cur); docs.push(cur); cur = null; } };
  function finish(d) {
    const h = d.hl, rest = d.more;
    const hNums = h.filter(t => NUM.test(t)).map(n);
    d.rawNums = rest.flat().filter(t => NUM.test(t)).map(n); d.split = !hNums.length && d.rawNums.length > 0; if (d.split) { d.fop = d.fop || "CA/CC"; }
    d.ta = hNums.length ? hNums[0] : 0; d.fare = hNums.length > 1 ? hNums[1] : 0; d.bp = hNums.length ? hNums[hNums.length - 1] : 0;
    d.date = d.date || ""; d.pen = 0; d.penCode = "";
    // penalty "amount CP"
    const allLines = [h, ...rest];
    allLines.forEach(tk => tk.forEach((t, i) => { if (PEN_CODES.includes(t) && i > 0 && NUM.test(tk[i - 1])) { d.pen = r2(d.pen + n(tk[i - 1])); d.penCode = t; } }));
    const taxTot = r2(d.ta - d.fare - d.pen); d.taxTotal = taxTot; d.taxes = [];
    const multi = rest.some(tk => tk.length && (tk.every(isCode) || (tk.length === 1 && NUM.test(tk[0]))));
    if (!multi) { // single line: pairs "amount CODE" after FARE
      h.forEach((t, i) => { if (i > 0 && isCode(t) && !PEN_CODES.includes(t) && NUM.test(h[i - 1]) && i - 1 > h.findIndex(x => NUM.test(x)) + 1 - 1) d.taxes.push({code: t, amt: n(h[i - 1])}); });
      // first numeric after TA is FARE: drop a pair that consumed FARE
      if (d.taxes.length && h.filter(x => NUM.test(x)).length >= 2) { const fi = h.findIndex(x => NUM.test(x)), si = h.findIndex((x, i) => i > fi && NUM.test(x)); d.taxes = d.taxes.filter(x => !(h[si + 1] === x.code && n(h[si]) === x.amt && x.amt === d.fare)); }
    } else {
      const codes = []; allLines.forEach(tk => tk.forEach(t => { if (isCode(t) && !PEN_CODES.includes(t)) codes.push(t); }));
      const amts = []; let trail = false; rest.forEach((tk, i) => { const nums = tk.filter((t, j) => NUM.test(t) && !PEN_CODES.includes(tk[j + 1]));
        if (!trail && nums.length >= 3 && tk.every(t => NUM.test(t) || PEN_CODES.includes(t))) { trail = true; if (nums.length >= 4) amts.push(n(nums[0])); return; }
        nums.forEach(t => amts.push(n(t))); });
      if (amts.length === codes.length + 1) { const k = amts.findIndex(x => x === d.fare); if (k >= 0) amts.splice(k, 1); }
      const sc = [...codes].sort();
      if (sc.length === amts.length) d.taxes = sc.map((c, i) => ({code: c, amt: amts[i]}));
      else if (sc.length && amts.length > sc.length && (() => { for (let s = amts.length - sc.length; s >= 0; s--) { const w = amts.slice(s, s + sc.length); if (Math.abs(w.reduce((x, y) => x + y, 0) - taxTot) < 0.02) { d.taxes = sc.map((c, i) => ({code: c, amt: w[i]})); return true; } } return false; })()) {}
      else { d.taxWarn = `codes ${sc.length} / amounts ${amts.length}`; if (codes.includes("K7") && d.stat === "D") { const tgt = (d.ta - d.pen) * 15 / 115, best = amts.reduce((b, x) => Math.abs(x - tgt) < Math.abs(b - tgt) ? x : b, Infinity); if (Math.abs(best - tgt) < 1) d.taxes = [{code: "K7", amt: best}]; } }
    }
    const k7 = d.taxes.filter(x => x.code === "K7").reduce((s, x) => s + x.amt, 0); d.vat = r2(k7);
    // no K7 on the document = international (no VAT, only other taxes). K7 listed but amount unreadable -> flag for review, never estimate
    if (!d.vat && allLines.some(tk => tk.includes("K7"))) d.vatWarn = true;
    if (d.taxes.length && Math.abs(r2(d.taxes.reduce((s, x) => s + x.amt, 0)) - taxTot) > 0.02) d.taxWarn = `taxes ${r2(d.taxes.reduce((s, x) => s + x.amt, 0))} ≠ ${taxTot}`;
    d.comm = r2((d.fop === "CA" ? d.ta : 0) - d.bp);
    delete d.hl; delete d.more;
  }
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i]; if (!L) continue; const tk = L.split(/\s+/);
    let m;
    if ((m = /Billing Period:\s*(\d+)\((\d{2}-[A-Z]{3}-\d{4}) to (\d{2}-[A-Z]{3}-\d{4})\)\s*REFERENCE:\s*([\d ]+-\s*\d+)/.exec(L))) { hdr.period = m[1]; hdr.from = dIso4(m[2]); hdr.to = dIso4(m[3]); hdr.ref = m[4].replace(/\s+/g, ""); hdr.iataAcc = hdr.ref.split("-")[0]; continue; }
    if ((m = /^FCAGBILLDET AGENT BILLING DETAILS ([\d-]+ \d+ \d) (.*)$/.exec(L))) { if (!hdr.agentCode) { hdr.agentCode = m[1]; hdr.agent = m[2].trim(); } if (seenDetail) inPageHdr = true; continue; }
    if ((m = /^CATEGORY (\S+)$/.exec(L))) { close(); cat = m[1]; seenDetail = Object.keys(summary).length > 0; continue; }
    if ((m = /^\*\*\* (.+)$/.exec(L))) { close(); sec = m[1].trim(); seenDetail = true; inPageHdr = false; continue; }
    if ((m = /^(ISSUES|REFUNDS|DEBIT MEMOS|CREDIT MEMOS|ADJUSTMENTS|[A-Z ]+) TOTAL (-?[\d,]+\.\d{2}( -?[\d,]+\.\d{2}){9})$/.exec(L)) && seenDetail) { close(); (totals[cat] || (totals[cat] = {}))[m[1]] = totOf(m[2].split(" ")); continue; }
    if (/^\d{2}-[A-Z]{3}-\d{4} .*Page\s*:/.test(L)) { if (!hdr.printed) hdr.printed = dIso4(L); inPageHdr = true; continue; }

    const iv = C.find(c => (c.product || "") === sc && c.from === to && c.to === from); if (iv && N(iv.factor)) return 1 / N(iv.factor);
  }

}

  if (!f) throw new Error(`مفيش تحويل وحدة من ${refCode("unit", unit)} إلى ${refCode("unit", p.unitInv)} للصنف ${p.code} (شاشة «تحويلات الوحدات»)`); return r4(q * f); };

    <div class="tbl" style="margin-top:10px"><table class="lines"><thead><tr><th>المنتج</th><th>الوصف</th><th class="num">الكمية</th><th>الوحدة</th><th class="num">سعر الوحدة</th><th class="num">خصم %</th><th class="num">الصافي</th><th>الضريبة</th><th>المخزن</th>

      ${mode === "INV" && !SO ? `<td><input type="number" step="any" data-ip="${l.id}" value="${ipr[l.id] ?? r4(lineNet(l))}" style="width:100px" title="سعر الوحدة الصافي في فاتورة المورد"></td>` : ""}
      <td>${lk ? "" : `<button class="sm danger" data-rm="${i}">×</button>`}</td></tr>`; }).join("") || `<tr><td colspan="13"><div class="empty">ضيف سطور</div></td></tr>`}</tbody>

          persist(); toast(res && res.warnings && res.warnings.length ? `اترحّلت بفروق مطابقة ⚠ (${res.warnings.join("، ")})` : res && res.variance ? `تم الترحيل ✓ — قيد فروق ${res.variance}` : "تم الترحيل ✓"); route(current); return openOrder(kind, o.id); }
        catch (x) { persist(); route(current); return openOrder(kind, o.id, x.message); } }
      if (b.id === "ocan") { if (!confirm("إلغاء الأمر؟")) return; sync(); o.status = "CANCELLED"; commit(); persist(); closeModal(); toast("اتلغى الأمر"); route(current); } };
  };
  draw();
}

/* =================== inventory journals =================== */
const IJT = [["ADJ","تسوية (Inventory adjustment)"],["TRF","تحويل بين مخازن (Transfer)"],["COUNT","جرد (Counting)"]];
function postInvJ(j) {
  if (!j.lines.length) throw new Error("اليومية من غير سطور");
  const no = j.number || nextNo("IJ"), gl = [], date = j.date || today(); j.number = no;
  j.lines.forEach((l, i) => { const p = rec("product", l.product), n = i + 1;
    if (!p) throw new Error(`سطر ${n}: اختار الصنف`); if (!isStocked(p)) throw new Error(`سطر ${n}: ${p.code} مش صنف مخزني`);
    if (!rec("warehouse", l.wh)) throw new Error(`سطر ${n}: اختار المخزن`);
    const memo = `${no} ${p.code}`;
    if (j.type === "TRF") { const q = N(l.qty); if (!(q > 0)) throw new Error(`سطر ${n}: الكمية لازم تكون موجبة`);
      if (!rec("warehouse", l.toWh) || l.toWh === l.wh) throw new Error(`سطر ${n}: اختار مخزن استلام مختلف`);
      const cost = invOut(p, l.wh, q, date, no, "TRF"); invIn(p, l.toWh, q, cost, date, no, "TRF"); l.posted = q; return; }
    const q = j.type === "COUNT" ? r4(N(l.counted) - onHand(p.id, l.wh).qty) : N(l.qty); l.posted = q; if (!q) return;
    if (q > 0) { const uc = modelOf(p).model === "STD" ? N(p.costPrice) : (N(l.unitCost) || unitCost(p)), cost = r2(q * uc);
      invIn(p, l.wh, q, cost, date, no, "ADJ"); gl.push(L(postAcc("INV", p), cost, {memo}), L(postAcc("INV_ADJ", p), -cost, {memo})); }
    else { const cost = invOut(p, l.wh, -q, date, no, "ADJ"); gl.push(L(postAcc("INV_ADJ", p), cost, {memo}), L(postAcc("INV", p), -cost, {memo})); } });
  const g = gl.filter(Boolean); if (g.length) j.jv = mkJournal(date, `يومية مخزون ${no}${j.desc ? " — " + j.desc : ""}`, g, no, "INVENT").number;
  j.status = "POSTED"; j.postedAt = new Date().toISOString();
}

    ${j.lines.map((l, i) => { const p = rec("product", l.product), oh = p && l.wh ? onHand(p.id, l.wh).qty : ""; return `<tr data-i="${i}">

const HT = {SALES: "تغيير سعر البيع", PURCH: "تغيير سعر الشراء", COST: "تغيير سعر التكلفة", PO_ACT: "شراء فعلي", SO_ACT: "بيع فعلي"};
